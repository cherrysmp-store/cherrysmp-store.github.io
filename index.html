<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherrySMP Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --crate:#4CAF50;
  --rank:#2196F3;
  --credit:#FFEB3B;
  --spawner:#F44336;
  --bundle:#9C27B0;
  --bg-dark:#0e0e14;
  --glass:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);
  --accent:#FF4081;
  --font:"Inter",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--font);
  background:#0e0e14;
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}
/* ------------------- HERO ------------------- */
.hero{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  height:100vh;
  background:linear-gradient(-45deg,#4CAF50,#2196F3,#FFEB3B,#F44336,#9C27B0);
  background-size:400% 400%;
  animation:gradient 15s ease infinite;
}
@keyframes gradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
.hero h1{
  font-size:60px;
  font-weight:800;
  text-shadow:0 0 20px #fff,0 0 30px #FF4081,0 0 40px #FF4081;
  animation:shimmer 2.5s linear infinite;
}
@keyframes shimmer{
  0%{text-shadow:0 0 20px #fff,0 0 30px #FF4081,0 0 40px #FF4081;}
  50%{text-shadow:0 0 40px #fff,0 0 50px #FF4081,0 0 60px #FF4081;}
  100%{text-shadow:0 0 20px #fff,0 0 30px #FF4081,0 0 40px #FF4081;}
}
.hero p{
  margin-top:15px;
  font-size:20px;
  opacity:0.8;
}
.hero .cta-btns{
  display:flex;
  gap:20px;
  margin-top:40px;
}
.cta-btn{
  padding:15px 30px;
  font-size:18px;
  font-weight:700;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(45deg,#FF4081,#FFEB3B);
  color:white;
  box-shadow:0 0 15px #FF4081,0 0 30px #FFEB3B;
  transition:0.3s;
  animation:pulse 2s infinite;
}
.cta-btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px #FF4081,0 0 40px #FFEB3B;
}
@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.05);}
}
/* ------------------- NAV ------------------- */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 8%;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(20px);
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid var(--border);
}
nav h2{font-size:24px;font-weight:800;}
nav ul{list-style:none;display:flex;gap:25px;}
nav a{text-decoration:none;color:white;font-weight:600;transition:0.3s;}
nav a:hover{color:var(--accent);}
#spinBtn{position:relative;padding:10px 20px;background:var(--accent);border:none;border-radius:10px;color:white;font-weight:700;cursor:pointer;animation:shake 1.5s infinite;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}50%{transform:translateX(5px);}75%{transform:translateX(-5px);}}

/* ------------------- CATEGORIES ------------------- */
.categories{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:40px 8%;
}
.category-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px 14px;
  border-radius:20px;
  border:none;
  cursor:pointer;
  font-weight:700;
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  color:white;
  transition:0.3s;
  text-align:center;
}
.category-btn img{width:70px;height:70px;margin-bottom:5px;}
.category-btn:hover,.category-btn.active{
  transform:scale(1.1);
  box-shadow:0 0 20px #FF4081,0 0 35px #FFEB3B;
  background:linear-gradient(90deg,#FF4081,#FFEB3B);
}

/* ------------------- PRODUCTS ------------------- */
.products{padding:40px 8% 80px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;}
.card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  transition:0.3s;
  position:relative;
}
.card:hover{
  transform:translateY(-8px) scale(1.03);
  box-shadow:0 0 30px #FF4081,0 0 50px #FFEB3B;
}
.card img{width:100px;height:100px;border-radius:12px;margin-bottom:10px;}
.card h3{font-size:20px;margin-bottom:5px;}
.price{font-size:18px;font-weight:700;margin-top:auto;}
.buy, .qty-btn{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}
.buy{
  background:linear-gradient(45deg,var(--accent),#FFEB3B);
  color:white;
}
.buy:hover{box-shadow:0 0 25px var(--accent),0 0 40px #FFEB3B;}
.qty-btn{
  background:transparent;
  border:1px solid var(--border);
  color:white;
}
.qty-btn:hover{
  background:var(--accent);
  box-shadow:0 0 15px var(--accent);
}

/* ------------------- PANEL ------------------- */
.panel{
  margin:40px 8%;
  padding:25px;
  border-radius:15px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
}
.panel h3{text-align:center;margin-bottom:15px;}
.panel ul{list-style:none;}
.panel li{padding:6px 0;border-bottom:1px solid var(--border);}

/* ------------------- CART & MODALS ------------------- */
#cartModal, #spinModal{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:var(--glass);
  backdrop-filter:blur(20px);
  padding:20px;
  border-radius:20px;
  display:none;
  flex-direction:column;
  align-items:center;
  z-index:1000;
}
#cartItems{max-height:300px;overflow-y:auto;margin-bottom:15px;}
#cartItems li{padding:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
#cartOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;z-index:999;}
#spinWheel{border-radius:50%;border:2px solid var(--border);}
#spinModal button, #cartModal button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}
#spinModal button:hover,#cartModal button:hover{background:var(--accent);}
.live-sale{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:15px 20px;
  border-radius:12px;
  opacity:0;
  transform:translateY(20px);
  transition:0.5s;
  z-index:9999;
}
.live-sale.active{opacity:1;transform:translateY(0);}
.tooltip{
  position:absolute;
  background:#111;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  font-size:14px;
  white-space:nowrap;
  display:none;
  z-index:1000;
  box-shadow:0 0 10px #FF4081,0 0 20px #FFEB3B;
}
</style>
</head>
<body>

<nav>
  <h2>CherrySMP Store</h2>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">Support</a></li>
    <li><a id="openCartBtn">Cart 🛒</a></li>
  </ul>
</nav>

<section class="hero">
  <h1>Welcome to CherrySMP Store</h1>
  <p>Support the server and unlock exclusive perks!</p>
  <div class="cta-btns">
    <button class="cta-btn" id="heroSpinBtn">🎡 Spin Wheel</button>
    <button class="cta-btn" id="enterStoreBtn">🛒 Enter Store</button>
  </div>
</section>

<section class="categories">
  <button class="category-btn active" data-category="crates"><img src="https://i.imgur.com/4kJzklV.png"/><span>Crates</span></button>
  <button class="category-btn" data-category="ranks"><img src="https://i.imgur.com/qOgqVtB.png"/><span>Ranks</span></button>
  <button class="category-btn" data-category="credits"><img src="https://i.imgur.com/hP4gYjk.png"/><span>Credits</span></button>
  <button class="category-btn" data-category="spawners"><img src="https://i.imgur.com/qOmLwAc.png"/><span>Spawners</span></button>
  <button class="category-btn" data-category="bundles"><img src="https://i.imgur.com/P5rNwCr.png"/><span>Bundles</span></button>
</section>

<section class="products">
  <div class="grid" id="productGrid"></div>
</section>

<div class="panel">
  <h3>🏆 Top Customers</h3>
  <ul id="topCustomers"></ul>
</div>

<div class="panel">
  <h3>🧾 Recent Orders</h3>
  <ul id="recentOrders"></ul>
</div>

<div id="spinModal">
  <h2>Daily Spin Wheel</h2>
  <canvas id="spinWheel" width="400" height="400"></canvas>
  <button id="closeSpin">Close</button>
  <div id="spinMessage"></div>
</div>

<div id="cartOverlay"></div>
<div id="cartModal">
  <h2>Your Cart</h2>
  <ul id="cartItems"></ul>
  <button id="finishOrder">Finish Order</button>
  <button id="closeCart">Close</button>
</div>

<div class="live-sale" id="liveSale"></div>
<div class="tooltip" id="tooltip"></div>

<script>
// ---------- STORE DATA ----------
const storeData = {
  crates:[
    {name:"Snow Key",price:0.19,desc:"Unlock winter-themed rewards."},
    {name:"Ocean Key",price:0.49,desc:"Ocean-themed rewards."},
    {name:"Slime Key",price:0.99,desc:"Fun slime items."},
    {name:"Maple Key",price:1.79,desc:"Maple perks."},
    {name:"Cherry Key",price:2.49,desc:"Exclusive Cherry rewards!"}
  ],
  spawners:[
    {name:"Blaze",price:0.03,desc:"Spawn Blaze mobs."},
    {name:"Creeper",price:0.04,desc:"Creeper spawners."},
    {name:"Skeleton",price:0.05,desc:"Skeletons easily."},
    {name:"Iron Golem",price:0.07,desc:"Iron Golem farms."}
  ],
  ranks:[
    {name:"VIP (Lifetime)",price:2,desc:"VIP perks forever."},
    {name:"Maple (Lifetime)",price:4,desc:"Maple perks forever."},
    {name:"Cherry (Lifetime)",price:7,desc:"Cherry perks forever."},
    {name:"Cherry+ (Lifetime)",price:10,desc:"Premium perks for life."},
    {name:"VIP (30d)",price:1,desc:"VIP perks 30 days."},
    {name:"Maple (30d)",price:2,desc:"Maple perks 30 days."},
    {name:"Cherry (30d)",price:3.5,desc:"Cherry perks 30 days."},
    {name:"Cherry+ (30d)",price:5,desc:"Premium perks 30 days."}
  ]
};

// ---------- QUANTITY OPTIONS ----------
const qtyOptions = {
  crates: [1,3,5,15],
  spawners: [3,5,10,25]
};

// ---------- STORAGE ----------
let cart = JSON.parse(localStorage.getItem("cart"))||[];
let grid = document.getElementById("productGrid");
let tooltip = document.getElementById("tooltip");

// ---------- RENDER CARD FUNCTION ----------
function renderCard(product, category){
  let card = document.createElement("div");
  card.className = "card";
  
  let qtyHtml = "";
  let defaultQty = qtyOptions[category]?.[0] || 1;
  if(qtyOptions[category]){
    qtyHtml = `<div class="qty-options">` + qtyOptions[category].map((q,i)=>`
      <button class="qty-btn ${i===0?'active':''}" data-qty="${q}">${q}x</button>`).join("") + `</div>`;
  }

  card.innerHTML = `
    <h3>${product.name}</h3>
    <p>${product.desc}</p>
    <div class="price">${product.price.toFixed(2)}€</div>
    ${qtyHtml}
    <button class="buy">Add to Cart</button>
  `;

  grid.appendChild(card);
}

// ---------- RENDER CATEGORY ----------
function renderCategory(category){
  grid.innerHTML = "";
  storeData[category].forEach(product => renderCard(product, category));
}

// ---------- EVENT DELEGATION ----------
grid.addEventListener("click", e=>{
  const card = e.target.closest(".card");
  if(!card) return;

  const categoryBtn = document.querySelector(".category-btn.active");
  const category = categoryBtn.dataset.category;

  // Qty buttons
  if(e.target.classList.contains("qty-btn")){
    card.querySelectorAll(".qty-btn").forEach(b=>b.classList.remove("active"));
    e.target.classList.add("active");
    return;
  }

  // Add to Cart
  if(e.target.classList.contains("buy")){
    let qty = parseInt(card.querySelector(".qty-btn.active")?.dataset.qty || 1);
    let mc = document.getElementById("mcName")?.value || "Unknown";
    let name = card.querySelector("h3").innerText + (qty>1?` x${qty}`:"");
    let price = parseFloat(card.querySelector(".price").innerText) * qty;

    cart.push({name:name,qty:qty,price:price,mc:mc});
    localStorage.setItem("cart", JSON.stringify(cart));
    showLiveSale(mc, name);
  }
});

// ---------- LIVE SALE ----------
function showLiveSale(player,item){
  const popup = document.getElementById("liveSale");
  popup.textContent = `🔥 ${player} added ${item}!`;
  popup.classList.add("active");
  setTimeout(()=>popup.classList.remove("active"),4000);
}

// ---------- CATEGORY BUTTONS ----------
document.querySelectorAll(".category-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".category-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    if(btn.dataset.category === "ranks"){
      openRankModal();
    } else renderCategory(btn.dataset.category);
  });
});

// ---------- RANKS MODAL ----------
function openRankModal(){
  const modal = document.getElementById("rankModal");
  const overlay = document.getElementById("rankOverlay");
  modal.style.display = "block";
  overlay.style.display = "block";

  document.querySelectorAll(".rankTypeBtn").forEach(btn=>{
    btn.onclick = ()=>{
      modal.style.display = "none";
      overlay.style.display = "none";

      let type = btn.dataset.type; // lifetime / subscription
      let filtered = storeData.ranks.filter(r=>{
        return type==="lifetime"? r.name.toLowerCase().includes("lifetime") : r.name.toLowerCase().includes("30d");
      });
      grid.innerHTML = "";
      filtered.forEach(r=> renderCard(r, "ranks"));
    };
  });
}

// ---------- INITIAL ----------
renderCategory("crates");
</script>
</body>
</html>
