<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherrySMP Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --crate:#4CAF50;
  --rank:#2196F3;
  --credit:#FFEB3B;
  --spawner:#F44336;
  --bundle:#9C27B0;
  --bg-dark:#0e0e14;
  --glass:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);
  --accent:#FF4081;
  --font:"Inter",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--font);
  background:#0e0e14;
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}
/* ------------------- HERO ------------------- */
.hero{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  height:100vh;
  background:linear-gradient(-45deg,#4CAF50,#2196F3,#FFEB3B,#F44336,#9C27B0);
  background-size:400% 400%;
  animation:gradient 15s ease infinite;
}
@keyframes gradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
.hero h1{
  font-size:60px;
  font-weight:800;
  text-shadow:0 0 20px #fff,0 0 30px #FF4081,0 0 40px #FF4081;
  animation:shimmer 2.5s linear infinite;
}
@keyframes shimmer{
  0%{text-shadow:0 0 20px #fff,0 0 30px #FF4081,0 0 40px #FF4081;}
  50%{text-shadow:0 0 40px #fff,0 0 50px #FF4081,0 0 60px #FF4081;}
  100%{text-shadow:0 0 20px #fff,0 0 30px #FF4081,0 0 40px #FF4081;}
}
.hero p{
  margin-top:15px;
  font-size:20px;
  opacity:0.8;
}
.hero .cta-btns{
  display:flex;
  gap:20px;
  margin-top:40px;
}
.cta-btn{
  padding:15px 30px;
  font-size:18px;
  font-weight:700;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(45deg,#FF4081,#FFEB3B);
  color:white;
  box-shadow:0 0 15px #FF4081,0 0 30px #FFEB3B;
  transition:0.3s;
  animation:pulse 2s infinite;
}
.cta-btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px #FF4081,0 0 40px #FFEB3B;
}
@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.05);}
}
/* ------------------- NAV ------------------- */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 8%;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(20px);
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid var(--border);
}
nav h2{font-size:24px;font-weight:800;}
nav ul{list-style:none;display:flex;gap:25px;}
nav a{text-decoration:none;color:white;font-weight:600;transition:0.3s;}
nav a:hover{color:var(--accent);}
#spinBtn{position:relative;padding:10px 20px;background:var(--accent);border:none;border-radius:10px;color:white;font-weight:700;cursor:pointer;animation:shake 1.5s infinite;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}50%{transform:translateX(5px);}75%{transform:translateX(-5px);}}

/* ------------------- CATEGORIES ------------------- */
.categories{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:40px 8%;
}
.category-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px 14px;
  border-radius:20px;
  border:none;
  cursor:pointer;
  font-weight:700;
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  color:white;
  transition:0.3s;
  text-align:center;
}
.category-btn img{width:70px;height:70px;margin-bottom:5px;}
.category-btn:hover,.category-btn.active{
  transform:scale(1.1);
  box-shadow:0 0 20px #FF4081,0 0 35px #FFEB3B;
  background:linear-gradient(90deg,#FF4081,#FFEB3B);
}

/* ------------------- PRODUCTS ------------------- */
.products{padding:40px 8% 80px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;}
.card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  transition:0.3s;
  position:relative;
}
.card:hover{
  transform:translateY(-8px) scale(1.03);
  box-shadow:0 0 30px #FF4081,0 0 50px #FFEB3B;
}
.card img{width:100px;height:100px;border-radius:12px;margin-bottom:10px;}
.card h3{font-size:20px;margin-bottom:5px;}
.price{font-size:18px;font-weight:700;margin-top:auto;}
.buy, .qty-btn{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}
.buy{
  background:linear-gradient(45deg,var(--accent),#FFEB3B);
  color:white;
}
.buy:hover{box-shadow:0 0 25px var(--accent),0 0 40px #FFEB3B;}
.qty-btn{
  background:transparent;
  border:1px solid var(--border);
  color:white;
}
.qty-btn:hover{
  background:var(--accent);
  box-shadow:0 0 15px var(--accent);
}

/* ------------------- PANEL ------------------- */
.panel{
  margin:40px 8%;
  padding:25px;
  border-radius:15px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
}
.panel h3{text-align:center;margin-bottom:15px;}
.panel ul{list-style:none;}
.panel li{padding:6px 0;border-bottom:1px solid var(--border);}

/* ------------------- CART & MODALS ------------------- */
#cartModal, #spinModal{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:var(--glass);
  backdrop-filter:blur(20px);
  padding:20px;
  border-radius:20px;
  display:none;
  flex-direction:column;
  align-items:center;
  z-index:1000;
}
#cartItems{max-height:300px;overflow-y:auto;margin-bottom:15px;}
#cartItems li{padding:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
#cartOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;z-index:999;}
#spinWheel{border-radius:50%;border:2px solid var(--border);}
#spinModal button, #cartModal button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}
#spinModal button:hover,#cartModal button:hover{background:var(--accent);}
.live-sale{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:15px 20px;
  border-radius:12px;
  opacity:0;
  transform:translateY(20px);
  transition:0.5s;
  z-index:9999;
}
.live-sale.active{opacity:1;transform:translateY(0);}
.tooltip{
  position:absolute;
  background:#111;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  font-size:14px;
  white-space:nowrap;
  display:none;
  z-index:1000;
  box-shadow:0 0 10px #FF4081,0 0 20px #FFEB3B;
}
</style>
</head>
<body>

<nav>
  <h2>CherrySMP Store</h2>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">Support</a></li>
    <li><a id="openCartBtn">Cart 🛒</a></li>
  </ul>
</nav>

<section class="hero">
  <h1>Welcome to CherrySMP Store</h1>
  <p>Support the server and unlock exclusive perks!</p>
  <div class="cta-btns">
    <button class="cta-btn" id="heroSpinBtn">🎡 Spin Wheel</button>
    <button class="cta-btn" id="enterStoreBtn">🛒 Enter Store</button>
  </div>
</section>

<section class="categories">
  <button class="category-btn active" data-category="crates"><img src="https://i.imgur.com/4kJzklV.png"/><span>Crates</span></button>
  <button class="category-btn" data-category="ranks"><img src="https://i.imgur.com/qOgqVtB.png"/><span>Ranks</span></button>
  <button class="category-btn" data-category="credits"><img src="https://i.imgur.com/hP4gYjk.png"/><span>Credits</span></button>
  <button class="category-btn" data-category="spawners"><img src="https://i.imgur.com/qOmLwAc.png"/><span>Spawners</span></button>
  <button class="category-btn" data-category="bundles"><img src="https://i.imgur.com/P5rNwCr.png"/><span>Bundles</span></button>
</section>

<section class="products">
  <div class="grid" id="productGrid"></div>
</section>

<div class="panel">
  <h3>🏆 Top Customers</h3>
  <ul id="topCustomers"></ul>
</div>

<div class="panel">
  <h3>🧾 Recent Orders</h3>
  <ul id="recentOrders"></ul>
</div>

<div id="spinModal">
  <h2>Daily Spin Wheel</h2>
  <canvas id="spinWheel" width="400" height="400"></canvas>
  <button id="closeSpin">Close</button>
  <div id="spinMessage"></div>
</div>

<div id="cartOverlay"></div>
<div id="cartModal">
  <h2>Your Cart</h2>
  <ul id="cartItems"></ul>
  <button id="finishOrder">Finish Order</button>
  <button id="closeCart">Close</button>
</div>

<div class="live-sale" id="liveSale"></div>
<div class="tooltip" id="tooltip"></div>

<script>
// ---------------------- STORE DATA ----------------------
const storeData = {
  crates:[
    {name:"Snow Key",price:0.19,desc:"Unlock winter-themed rewards and items."},
    {name:"Ocean Key",price:0.49,desc:"Contains ocean-themed rewards and treasures."},
    {name:"Slime Key",price:0.99,desc:"Get fun slime items and rare drops!"},
    {name:"Maple Key",price:1.79,desc:"Unlock Maple perks and surprises."},
    {name:"Cherry Key",price:2.49,desc:"Exclusive Cherry crate rewards!"}
  ],
  ranks:[
    {name:"VIP (Lifetime)",price:2,desc:"Unlock VIP perks forever."},
    {name:"Maple (Lifetime)",price:4,desc:"Exclusive Maple perks forever."},
    {name:"Cherry (Lifetime)",price:7,desc:"Cherry perks forever."},
    {name:"Cherry+ (Lifetime)",price:10,desc:"Premium perks for life."},
    {name:"VIP (30d)",price:1,desc:"VIP perks for 30 days."},
    {name:"Maple (30d)",price:2,desc:"Maple perks for 30 days."},
    {name:"Cherry (30d)",price:3.5,desc:"Cherry perks for 30 days."},
    {name:"Cherry+ (30d)",price:5,desc:"Premium perks for 30 days."}
  ],
  credits:[
    {name:"100x Credits",price:1,desc:"100 in-game credits to spend freely."},
    {name:"250x Credits",price:2.29,desc:"250 credits for various purchases."},
    {name:"500x Credits",price:4.69,desc:"500 credits to boost your gameplay."},
    {name:"1000x Credits",price:9.19,desc:"Big pack of 1000 credits."},
    {name:"2500x Credits",price:23.50,desc:"Massive 2500 credits bundle."}
  ],
  spawners:[
    {name:"Blaze",price:0.03,desc:"Spawn Blaze mobs easily."},
    {name:"Creeper",price:0.04,desc:"Get Creeper spawners for traps."},
    {name:"Skeleton",price:0.05,desc:"Spawn Skeletons with ease."},
    {name:"Iron Golem",price:0.07,desc:"Create Iron Golem farms fast."}
  ],
  bundles:[
    {name:"Rookie Bundle",price:1.99,desc:"Starter bundle for new players."},
    {name:"Elite Bundle",price:6.99,desc:"Elite items and perks."},
    {name:"Cherry Bundle",price:11.99,desc:"Exclusive Cherry items."},
    {name:"Ultimate Supporter",price:19.99,desc:"All perks + exclusive items."}
  ]
};
for(let c in storeData){ storeData[c].sort((a,b)=>a.price-b.price); }

let cart = JSON.parse(localStorage.getItem("cart"))||[];
let topCustomers = JSON.parse(localStorage.getItem("topCustomers"))||{};
let recentOrders = JSON.parse(localStorage.getItem("recentOrders"))||[];
let lastSpin = localStorage.getItem("lastSpin")||0;
let spinRewards = ["Nothing","Crate","Rank","Bundle"];
let spinWeights = [91,5,3,1];

const tooltip = document.getElementById("tooltip");
const grid = document.getElementById("productGrid");

// ---------------------- RENDER PRODUCTS ----------------------
function renderCategory(category){
  grid.innerHTML="";
  storeData[category].forEach(product=>{
    let card=document.createElement("div");
    card.className="card";

    let qtyOptions="";
    if(category==="crates"){
      qtyOptions = `<div class="qty-options">
        <button class="qty-btn active" data-qty="1">1x</button>
        <button class="qty-btn" data-qty="3">3x</button>
        <button class="qty-btn" data-qty="5">5x</button>
        <button class="qty-btn" data-qty="15">15x</button>
      </div>`;
    }
    if(category==="spawners"){
      qtyOptions = `<div class="qty-options">
        <button class="qty-btn active" data-qty="3">3x</button>
        <button class="qty-btn" data-qty="5">5x</button>
        <button class="qty-btn" data-qty="10">10x</button>
        <button class="qty-btn" data-qty="25">25x</button>
      </div>`;
    }

    card.innerHTML=`
      <h3>${product.name}</h3>
      <p>${product.desc}</p>
      <div class="price">${product.price.toFixed(2)}€</div>
      ${qtyOptions}
      <button class="buy">Add to Cart</button>
    `;

    let selectedQty = category==="spawners" ? 3 : 1;

    card.querySelectorAll(".qty-btn").forEach(btn=>{
      btn.addEventListener("click",()=>{
        selectedQty=parseInt(btn.dataset.qty);
        card.querySelectorAll(".qty-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    // Tooltip
    card.addEventListener("mouseover",e=>{
      tooltip.style.display="block";
      tooltip.textContent=product.desc;
      tooltip.style.left=e.pageX+15+"px";
      tooltip.style.top=e.pageY+15+"px";
    });
    card.addEventListener("mousemove",e=>{
      tooltip.style.left=e.pageX+15+"px";
      tooltip.style.top=e.pageY+15+"px";
    });
    card.addEventListener("mouseleave",()=>{tooltip.style.display="none";});

    // Add to cart
    card.querySelector(".buy").addEventListener("click",()=>{
      let mc=document.getElementById("mcName")?.value||"Unknown";
      let itemName = product.name;
      if(category==="crates" || category==="spawners") itemName += ` x${selectedQty}`;
      cart.push({name:itemName,qty:selectedQty,price:product.price,mc:mc});
      localStorage.setItem("cart",JSON.stringify(cart));
      showLiveSale(mc,itemName);
    });

    grid.appendChild(card);
  });
}

// ---------------------- CATEGORY SWITCH ----------------------
document.querySelectorAll(".category-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".category-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    if(btn.dataset.category==="ranks"){
      // Open rank type modal
      document.getElementById("rankModal").style.display="block";
      document.getElementById("rankOverlay").style.display="block";
      grid.innerHTML="";
    } else {
      renderCategory(btn.dataset.category);
    }
  });
});

// ---------------------- LIVE SALE ----------------------
function showLiveSale(player,item){
  let popup=document.getElementById("liveSale");
  popup.textContent=`🔥 ${player} just added ${item} to cart!`;
  popup.classList.add("active");
  setTimeout(()=>popup.classList.remove("active"),4000);
}

// ---------------------- CART MODAL ----------------------
const cartModal = document.getElementById("cartModal");
const cartOverlay = document.getElementById("cartOverlay");
const cartItems = document.getElementById("cartItems");
document.getElementById("openCartBtn").addEventListener("click",()=>{showCart();});
document.getElementById("closeCart").addEventListener("click",()=>{hideCart();});
function showCart(){cartModal.style.display="flex";cartOverlay.style.display="block";renderCartItems();}
function hideCart(){cartModal.style.display="none";cartOverlay.style.display="none";}
function renderCartItems(){
  cartItems.innerHTML="";
  cart.forEach((item,index)=>{
    let li=document.createElement("li");
    li.textContent=`${item.mc} - ${item.qty}x ${item.name} - ${(item.price*item.qty).toFixed(2)}€`;
    let removeBtn=document.createElement("button"); removeBtn.textContent="❌";
    removeBtn.addEventListener("click",()=>{cart.splice(index,1);localStorage.setItem("cart",JSON.stringify(cart));renderCartItems();});
    li.appendChild(removeBtn);
    cartItems.appendChild(li);
  });
}
document.getElementById("finishOrder").addEventListener("click",()=>{
  cart.forEach(item=>{
    topCustomers[item.mc]=(topCustomers[item.mc]||0)+item.qty;
    recentOrders.unshift(`${item.mc} bought ${item.qty}x ${item.name}`);
    if(recentOrders.length>8) recentOrders.pop();
  });
  localStorage.setItem("cart",JSON.stringify([]));
  localStorage.setItem("topCustomers",JSON.stringify(topCustomers));
  localStorage.setItem("recentOrders",JSON.stringify(recentOrders));
  cart=[];updateTopCustomers();updateRecentOrders();hideCart();
});

// ---------------------- UPDATE CUSTOMER UI ----------------------
function updateTopCustomers(){
  let list=document.getElementById("topCustomers");
  list.innerHTML="";
  Object.entries(topCustomers).sort((a,b)=>b[1]-a[1]).slice(0,5).forEach(entry=>{
    let li=document.createElement("li");
    li.textContent=`${entry[0]} - ${entry[1]} items`;
    list.appendChild(li);
  });
}
function updateRecentOrders(){
  let list=document.getElementById("recentOrders");
  list.innerHTML="";
  recentOrders.forEach(order=>{
    let li=document.createElement("li"); li.textContent=order; list.appendChild(li);
  });
}
updateTopCustomers(); updateRecentOrders();

// ---------------------- SPIN WHEEL ----------------------
const spinBtn=document.getElementById("heroSpinBtn");
const spinModal=document.getElementById("spinModal");
const closeSpin=document.getElementById("closeSpin");
const spinCanvas=document.getElementById("spinWheel");
const spinMsg=document.getElementById("spinMessage");
spinBtn.addEventListener("click",()=>{spinModal.style.display="flex";});
closeSpin.addEventListener("click",()=>{spinModal.style.display="none";});

let ctx=spinCanvas.getContext("2d");
let sectors = spinRewards.length;
let anglePer = 2*Math.PI/sectors;
function drawWheel(){
  for(let i=0;i<sectors;i++){
    ctx.beginPath();
    ctx.moveTo(200,200);
    ctx.arc(200,200,200,i*anglePer,(i+1)*anglePer);
    ctx.fillStyle=i%2==0?"#FF4081":"#FFEB3B";
    ctx.fill();
    ctx.save();
    ctx.translate(200,200);
    ctx.rotate(i*anglePer+anglePer/2);
    ctx.fillStyle="white";
    ctx.font="16px Inter";
    ctx.fillText(spinRewards[i],120,0);
    ctx.restore();
  }
}
drawWheel();

function spin(){
  let now=Date.now();
  if(now-lastSpin<24*60*60*1000){spinMsg.textContent="⏳ Already spun today!"; return;}
  lastSpin=now; localStorage.setItem("lastSpin",lastSpin);
  let spins=Math.random()*3+5;
  let randSector=Math.random(); let cumulative=0; let chosenIndex=0;
  for(let i=0;i<spinWeights.length;i++){ cumulative+=spinWeights[i]/100; if(randSector<cumulative){chosenIndex=i;break;}}
  let totalAngle=spins*2*Math.PI+chosenIndex*anglePer+anglePer/2;
  let currentAngle=0;
  let anim=setInterval(()=>{
    currentAngle+=0.2; ctx.save(); ctx.clearRect(0,0,400,400); ctx.translate(200,200); ctx.rotate(currentAngle); ctx.translate(-200,-200); drawWheel(); ctx.restore();
    if(currentAngle>=totalAngle){clearInterval(anim);spinMsg.textContent="🎉 You got: "+spinRewards[chosenIndex];
      if(spinRewards[chosenIndex]!=="Nothing"){
        let mc=document.getElementById("mcName")?.value||"Unknown";
        cart.push({name:spinRewards[chosenIndex],qty:1,price:0,mc:mc});
        localStorage.setItem("cart",JSON.stringify(cart));
      }
      confetti();
    }
  },10);
}
spinCanvas.addEventListener("click",spin);

// ---------------------- CONFETTI ----------------------
function confetti(){
  for(let i=0;i<150;i++){
    let div=document.createElement("div");
    div.style.position="fixed"; div.style.width="6px"; div.style.height="6px";
    div.style.background=["#FF4081","#FFEB3B","#4CAF50","#2196F3","#9C27B0"][Math.floor(Math.random()*5)];
    div.style.left=Math.random()*window.innerWidth+"px";
    div.style.top=Math.random()*window.innerHeight+"px";
    div.style.opacity=0.8; div.style.borderRadius="50%";
    document.body.appendChild(div);
    setTimeout(()=>div.remove(),3000);
  }
}

// ---------------------- RANK MODAL ----------------------
document.getElementById("closeRankModal").addEventListener("click",()=>{
  document.getElementById("rankModal").style.display="none";
  document.getElementById("rankOverlay").style.display="none";
});

document.querySelectorAll(".rankTypeBtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    let type = btn.dataset.type;
    document.getElementById("rankModal").style.display="none";
    document.getElementById("rankOverlay").style.display="none";

    grid.innerHTML="";
    let filteredRanks = storeData.ranks.filter(rank=>{
      if(type==="lifetime") return rank.name.toLowerCase().includes("(lifetime)");
      else return rank.name.toLowerCase().includes("(30d)");
    });

    filteredRanks.forEach(rank=>{
      let card=document.createElement("div");
      card.className="card";
      card.innerHTML=`
        <h3>${rank.name}</h3>
        <p>${rank.desc}</p>
        <div class="price">${rank.price.toFixed(2)}€</div>
        <button class="buy">Add to Cart</button>
      `;
      card.querySelector(".buy").addEventListener("click",()=>{
        let mc=document.getElementById("mcName")?.value||"Unknown";
        cart.push({name:rank.name,qty:1,price:rank.price,mc:mc});
        localStorage.setItem("cart",JSON.stringify(cart));
        showLiveSale(mc,rank.name);
      });
      grid.appendChild(card);
    });
  });
});
</script>
</body>
</html>
