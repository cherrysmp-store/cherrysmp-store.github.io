<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherrySMP Store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #d4f8d4, #fff0f5);
        color: #333;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        padding: 40px 20px;
        background: rgba(255,255,255,0.6);
        backdrop-filter: blur(10px);
        border-bottom: 2px solid #a8e6a3;
    }

    h1 {
        font-size: 3em;
        color: #ff6fa5;
        text-shadow: 0 0 10px rgba(255, 111, 165, 0.6);
    }

    .sale-banner {
        background: #ffb6c1;
        color: white;
        padding: 10px;
        font-weight: bold;
        animation: glow 2s infinite alternate;
    }

    @keyframes glow {
        from { box-shadow: 0 0 10px #ffb6c1; }
        to { box-shadow: 0 0 25px #ff6fa5; }
    }

    .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 40px;
    }

    .card {
        background: rgba(255,255,255,0.8);
        border-radius: 15px;
        padding: 20px;
        transition: transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
        border: 2px solid #c8f7c5;
    }

    .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .card h2 {
        color: #6fcf97;
    }

    .hidden {
        display: none;
    }

    .product {
        padding: 10px;
        margin: 10px 0;
        border-bottom: 1px solid #ddd;
    }

    button {
        background: #6fcf97;
        border: none;
        padding: 8px 12px;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #57b87f;
    }

    #cart {
        position: fixed;
        right: 20px;
        top: 20px;
        width: 300px;
        background: white;
        border-radius: 15px;
        padding: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    #cart h3 {
        margin-top: 0;
    }

    .checkout {
        margin-top: 10px;
    }

    .spring-glow {
        animation: springPulse 2s infinite;
        border: 2px solid #7cf07c;
    }

    @keyframes springPulse {
        0% { box-shadow: 0 0 5px #7cf07c; }
        50% { box-shadow: 0 0 20px #aaffaa; }
        100% { box-shadow: 0 0 5px #7cf07c; }
    }

</style>
</head>

<body>

<header>
    <h1>🌸 CherrySMP Store 🌸</h1>
</header>

<div class="sale-banner">
    🌷 Spring Sale - 20% OFF EVERYTHING 🌷
</div>

<div class="container">
    <div class="card" onclick="openCategory('ranks')">
        <h2>Ranks</h2>
    </div>
    <div class="card" onclick="openCategory('crates')">
        <h2>Crates</h2>
    </div>
    <div class="card" onclick="openCategory('bundles')">
        <h2>Bundles</h2>
    </div>
    <div class="card" onclick="openCategory('stuff')">
        <h2>Stuff</h2>
    </div>
</div>

<div id="products" class="container hidden"></div>

<div id="cart">
    <h3>🛒 Cart</h3>
    <div id="cart-items"></div>
    <p id="total"></p>

    <div class="checkout">
        <button onclick="checkoutPayPal()">PayPal</button>
        <button onclick="checkoutBank()">Bank Transfer</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
