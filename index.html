<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherrySMP Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#ff2d6f;--secondary:#ff7eb3;--accent:#ff9ec9;
  --dark:#0e0e14;--glass:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.08);
  --highlight:#fff176;--success:#6eff9e;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:linear-gradient(-45deg,#ff2d6f,#7b2ff7,#ff7eb3,#ff2d6f);
background-size:400% 400%;animation:gradient 18s ease infinite;color:white;min-height:100vh;overflow-x:hidden;}
@keyframes gradient{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 8%;background:rgba(0,0,0,0.4);
backdrop-filter:blur(20px);position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--border);}
nav h1{font-size:26px;font-weight:800;}
nav ul{list-style:none;display:flex;gap:30px;}
nav a{text-decoration:none;color:white;font-weight:600;transition:0.3s;cursor:pointer;}
nav a:hover{color:var(--accent);}
.hero{text-align:center;padding:120px 20px 80px;position:relative;}
.hero h2{font-size:60px;font-weight:800;}
.hero p{opacity:0.85;margin-top:10px;}
.hero input{margin-top:20px;padding:12px 15px;border-radius:10px;border:none;outline:none;text-align:center;width:260px;font-size:16px;transition:0.3s;}
.hero input:focus{box-shadow:0 0 15px var(--accent);}
#countdown{margin-top:30px;font-size:22px;font-weight:700;padding:12px 15px;background:rgba(0,0,0,0.4);border-radius:10px;display:inline-block;}
.categories{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;padding:40px 8%;}
.category-btn{padding:14px 28px;border-radius:50px;border:none;cursor:pointer;font-weight:700;background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(20px);color:white;transition:0.3s;}
.category-btn:hover,.category-btn.active{background:linear-gradient(90deg,var(--primary),var(--secondary));transform:scale(1.1);}
.products{padding:40px 8% 80px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;}
.card{background:var(--glass);border:1px solid var(--border);border-radius:20px;padding:30px;backdrop-filter:blur(20px);transition:0.4s;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 0 30px rgba(255,255,255,0.2);}
.card h3{font-size:22px;}
.price{font-size:20px;font-weight:800;margin-top:auto;}
.buy{margin-top:15px;padding:10px;border:none;border-radius:10px;background:var(--primary);color:white;font-weight:700;cursor:pointer;transition:0.3s;}
.buy:hover{background:var(--secondary);}
.qty-btn{padding:6px 12px;margin:5px 5px 5px 0;border-radius:8px;border:1px solid var(--border);background:transparent;color:white;cursor:pointer;transition:0.3s;}
.qty-btn:hover{background:var(--accent);}
.panel{margin:40px 8%;padding:25px;border-radius:15px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);}
.panel h3{text-align:center;margin-bottom:15px;}
.panel ul{list-style:none;}
.panel li{padding:6px 0;border-bottom:1px solid var(--border);}
.live-sale{position:fixed;bottom:20px;right:20px;background:#111;padding:15px 20px;border-radius:12px;opacity:0;transform:translateY(20px);transition:0.5s;z-index:9999;}
.live-sale.active{opacity:1;transform:translateY(0);}
#spinPopup{position:fixed;bottom:50px;right:-200px;width:180px;padding:12px;background:var(--primary);border-radius:10px;text-align:center;font-weight:700;color:white;cursor:pointer;transition:0.5s;z-index:999;}
#spinPopup.show{right:20px;}
#spinModal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--glass);backdrop-filter:blur(20px);padding:20px;border-radius:20px;display:none;flex-direction:column;align-items:center;z-index:1000;}
#spinModal canvas{margin-top:20px;border-radius:50%;border:2px solid var(--border);}
#spinModal button{margin-top:15px;padding:10px 25px;border:none;border-radius:10px;background:var(--accent);color:white;font-weight:700;cursor:pointer;transition:0.3s;}
#spinModal button:hover{background:var(--secondary);}
#cartModal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--glass);backdrop-filter:blur(20px);padding:20px;width:500px;border-radius:20px;display:none;flex-direction:column;z-index:1000;}
#cartModal h2{margin-bottom:15px;text-align:center;}
#cartItems{max-height:300px;overflow-y:auto;margin-bottom:15px;}
#cartItems li{padding:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
#cartModal button{padding:10px 20px;border:none;border-radius:10px;background:var(--primary);color:white;font-weight:700;cursor:pointer;margin-top:10px;}
#cartModal button:hover{background:var(--secondary);}
#cartOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;z-index:999;}
footer{text-align:center;padding:40px;opacity:0.6;}
</style>
</head>
<body>

<nav>
<h1>CherrySMP Store</h1>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Support</a></li>
<li><a id="openCartBtn">Cart 🛒</a></li>
</ul>
</nav>

<section class="hero">
<h2>Premium Server Store</h2>
<p>Support the server and unlock exclusive perks</p>
<input type="text" id="mcName" placeholder="Enter your Minecraft username">
<div id="countdown"></div>
</section>

<section class="categories">
<button class="category-btn active" data-category="crates">Crates</button>
<button class="category-btn" data-category="ranks">Ranks</button>
<button class="category-btn" data-category="credits">Credits</button>
<button class="category-btn" data-category="spawners">Spawners</button>
<button class="category-btn" data-category="bundles">Bundles</button>
</section>

<section class="products">
<div class="grid" id="productGrid"></div>
</section>

<div class="panel">
<h3>🏆 Top Customers</h3>
<ul id="topCustomers"></ul>
</div>

<div class="panel">
<h3>🧾 Recent Orders</h3>
<ul id="recentOrders"></ul>
</div>

<div id="spinPopup">🎡 Spin for Rewards!</div>
<div id="spinModal">
<h2>Daily Spin Wheel</h2>
<canvas id="spinWheel" width="400" height="400"></canvas>
<button id="closeSpin">Close</button>
<div id="spinMessage"></div>
</div>

<div id="cartOverlay"></div>
<div id="cartModal">
<h2>Your Cart</h2>
<ul id="cartItems"></ul>
<button id="finishOrder">Finish Order</button>
<button id="closeCart">Close</button>
</div>

<div class="live-sale" id="liveSale"></div>
<footer>© 2026 CherrySMP • Not affiliated with Mojang</footer>

<script>
// ================== STORE DATA ==================
const storeData={
crates:[{name:"Snow Key",price:0.19},{name:"Ocean Key",price:0.49},{name:"Slime Key",price:0.99},{name:"Maple Key",price:1.79},{name:"Cherry Key",price:2.49}],
ranks:[{name:"VIP (Lifetime)",price:2},{name:"Maple (Lifetime)",price:4},{name:"Cherry (Lifetime)",price:7},{name:"Cherry+ (Lifetime)",price:10},{name:"VIP (30d)",price:1},{name:"Maple (30d)",price:2},{name:"Cherry (30d)",price:3.5},{name:"Cherry+ (30d)",price:5}],
credits:[{name:"100x Credits",price:1},{name:"250x Credits",price:2.29},{name:"500x Credits",price:4.69},{name:"1000x Credits",price:9.19},{name:"2500x Credits",price:23.50}],
spawners:[{name:"Blaze",price:0.03},{name:"Creeper",price:0.04},{name:"Skeleton",price:0.05},{name:"Iron Golem",price:0.07}],
bundles:[{name:"Starter Bundle",price:1.99},{name:"Maple Bundle",price:6.99},{name:"Cherry Elite Bundle",price:11.99},{name:"Ultimate Supporter",price:19.99}]
};
for(let cat in storeData){storeData[cat].sort((a,b)=>a.price-b.price);}

// ================== VARIABLES ==================
let cart = JSON.parse(localStorage.getItem("cart"))||[];
let topCustomers = JSON.parse(localStorage.getItem("topCustomers"))||{};
let recentOrders = JSON.parse(localStorage.getItem("recentOrders"))||[];

// ================== RENDER PRODUCTS ==================
const grid = document.getElementById("productGrid");
function renderCategory(category){
grid.innerHTML="";
storeData[category].forEach(product=>{
let card=document.createElement("div");
card.className="card";
let qtyButtons="",quantities=[1,3,5,10];
if(category==="spawners"){quantities=[1,3,5,25];}
if(category==="spawners"||category==="crates"||category==="credits"){
qtyButtons="<div>";
quantities.forEach(q=>{qtyButtons+=`<button class="qty-btn">${q}x</button>`;});
qtyButtons+="</div>";
}
card.innerHTML=`<h3>${product.name}</h3><p>Premium server item</p><div class="price">${product.price.toFixed(2)}€</div>${qtyButtons}<button class="buy">Add to Cart</button>`;
let selectedQty=1;
let priceDiv=card.querySelector(".price");
card.querySelectorAll(".qty-btn").forEach(btn=>{
btn.addEventListener("click",()=>{selectedQty=parseInt(btn.textContent);priceDiv.textContent=(product.price*selectedQty).toFixed(2)+"€";});
});
card.querySelector(".buy").addEventListener("click",()=>{
let mc=document.getElementById("mcName").value||"Unknown";
cart.push({name:product.name,qty:selectedQty,price:product.price,mc});
localStorage.setItem("cart",JSON.stringify(cart));
showLiveSale(mc,product.name);renderCart();
});
grid.appendChild(card);
});
}

// ================== CATEGORY SWITCH ==================
document.querySelectorAll(".category-btn").forEach(btn=>{
btn.addEventListener("click",()=>{
document.querySelectorAll(".category-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
renderCategory(btn.dataset.category);
});
});

// ================== CART GUI ==================
const cartModal=document.getElementById("cartModal");
const cartOverlay=document.getElementById("cartOverlay");
const openCartBtn=document.getElementById("openCartBtn");
const closeCartBtn=document.getElementById("closeCart");
const finishOrderBtn=document.getElementById("finishOrder");
const cartItemsEl=document.getElementById("cartItems");

function renderCart(){
cartItemsEl.innerHTML="";
cart.forEach((item,i)=>{
let li=document.createElement("li");
li.textContent=`${item.mc}: ${item.qty}x ${item.name} - ${(item.price*item.qty).toFixed(2)}€`;
let removeBtn=document.createElement("button");
removeBtn.textContent="X";
removeBtn.style.background="transparent";removeBtn.style.border="none";removeBtn.style.color="white";removeBtn.style.cursor="pointer";
removeBtn.addEventListener("click",()=>{cart.splice(i,1);localStorage.setItem("cart",JSON.stringify(cart));renderCart();});
li.appendChild(removeBtn);cartItemsEl.appendChild(li);
});
}

openCartBtn.addEventListener("click",()=>{
cartOverlay.style.display="block";cartModal.style.display="flex";
renderCart();
});
closeCartBtn.addEventListener("click",()=>{
cartOverlay.style.display="none";cartModal.style.display="none";
});
finishOrderBtn.addEventListener("click",()=>{
cart.forEach(item=>{
if(topCustomers[item.mc]) topCustomers[item.mc]+=item.qty; else topCustomers[item.mc]=item.qty;
recentOrders.unshift(`${item.mc} bought ${item.qty}x ${item.name}`);
if(recentOrders.length>8) recentOrders.pop();
});
cart=[];localStorage.setItem("cart",JSON.stringify(cart));
localStorage.setItem("topCustomers",JSON.stringify(topCustomers));
localStorage.setItem("recentOrders",JSON.stringify(recentOrders));
updateTopCustomers();updateRecentOrders();renderCart();
cartOverlay.style.display="none";cartModal.style.display="none";
});

// ================== TOP CUSTOMERS & ORDERS ==================
function updateTopCustomers(){
let list=document.getElementById("topCustomers");list.innerHTML="";
Object.entries(topCustomers).sort((a,b)=>b[1]-a[1]).slice(0,5).forEach(entry=>{
let li=document.createElement("li");li.textContent=`${entry[0]} - ${entry[1]} items`;list.appendChild(li);
});
}
function updateRecentOrders(){
let list=document.getElementById("recentOrders");list.innerHTML="";
recentOrders.forEach(order=>{let li=document.createElement("li");li.textContent=order;list.appendChild(li);});
}
updateTopCustomers();updateRecentOrders();

// ================== LIVE SALE ==================
function showLiveSale(player,item){
let popup=document.getElementById("liveSale");
popup.textContent=`🔥 ${player} just added ${item} to cart!`;
popup.classList.add("active");setTimeout(()=>popup.classList.remove("active"),4000);
}

// ================== COUNTDOWN ==================
const countdownEl=document.getElementById("countdown");
const countdownKey="eventStartDate";
let startDate=localStorage.getItem(countdownKey);
if(!startDate){startDate=new Date().getTime(); localStorage.setItem(countdownKey,startDate);}
const countdownDuration=10*24*60*60*1000;
function updateCountdown(){
const now=new Date().getTime(); const distance=countdownDuration-(now-startDate);
if(distance<=0){countdownEl.textContent="🎉 Event has ended!"; return;}
const days=Math.floor(distance/(1000*60*60*24));
const hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes=Math.floor((distance%(1000*60*60))/(1000*60));
const seconds=Math.floor((distance%(1000*60))/1000);
countdownEl.textContent=`⏳ Event ends in: ${days}d ${hours}h ${minutes}m ${seconds}s`;
}
setInterval(updateCountdown,1000);updateCountdown();

// ================== SPIN WHEEL POPUP ==================
const spinPopup=document.getElementById("spinPopup");
const spinModal=document.getElementById("spinModal");
const closeSpin=document.getElementById("closeSpin");
spinPopup.addEventListener("click",()=>{spinModal.style.display="flex";});
closeSpin.addEventListener("click",()=>{spinModal.style.display="none";});

// Show spin popup on scroll for 5s
window.addEventListener("scroll",()=>{
spinPopup.classList.add("show");
setTimeout(()=>spinPopup.classList.remove("show"),5000);
});

// ================== SPIN WHEEL ==================
const spinBtn=document.getElementById("spinBtn");
const spinWheel=document.getElementById("spinWheel");
const ctx=spinWheel.getContext("2d");
const wheelRadius=180;
let spinningWheel=false;
const wheelRewards=[
{name:"Cherry Key",type:"crate"},{name:"Maple Rank (30d)",type:"rank"},{name:"Cherry Rank (30d)",type:"rank"},{name:"Starter Bundle",type:"bundle"},{name:"Nothing",type:"nothing"}];
const wheelSegments=[
{reward:wheelRewards[0],weight:15},{reward:wheelRewards[1],weight:10},{reward:wheelRewards[2],weight:10},{reward:wheelRewards[3],weight:5},{reward:wheelRewards[4],weight:60}];
const colors=["#ff2d6f","#ff7eb3","#ff9ec9","#7b2ff7","#fff176"];
function drawWheel(){
const center={x:spinWheel.width/2,y:spinWheel.height/2};
let startAngle=0;ctx.clearRect(0,0,spinWheel.width,spinWheel.height);
wheelSegments.forEach((seg,i)=>{
const angle=(seg.weight/100)*2*Math.PI;ctx.beginPath();ctx.moveTo(center.x,center.y);
ctx.arc(center.x,center.y,wheelRadius,startAngle,startAngle+angle);
ctx.fillStyle=colors[i % colors.length];ctx.fill();ctx.strokeStyle="#111";ctx.lineWidth=2;ctx.stroke();
ctx.save();ctx.translate(center.x,center.y);ctx.rotate(startAngle+angle/2);ctx.textAlign="right";
ctx.fillStyle="#fff";ctx.font="14px Inter";ctx.fillText(seg.reward.name,wheelRadius-10,5);ctx.restore();
startAngle+=angle;
});
}
drawWheel();
function weightedRandom(){const total=wheelSegments.reduce((a,b)=>a+b.weight,0);let r=Math.random()*total;
for(const seg of wheelSegments){if(r<seg.weight)return seg.reward;r-=seg.weight;}
return wheelSegments[wheelSegments.length-1].reward;}
function checkSpinAvailable(){const lastSpin=localStorage.getItem("lastSpinTime");if(!lastSpin)return true;return Date.now()-parseInt(lastSpin)>24*60*60*1000;}
function easeOutQuart(t){return 1-(--t)*t*t*t;}
function createConfetti(){const colors=["#ff2d6f","#ff7eb3","#ff9ec9","#7b2ff7","#fff176"];const duration=2000;const startTime=performance.now();
function drawConfetti(now){const elapsed=now-startTime;ctx.clearRect(0,0,spinWheel.width,spinWheel.height);drawWheel();
for(let i=0;i<30;i++){ctx.beginPath();ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];
ctx.arc(Math.random()*spinWheel.width,Math.random()*spinWheel.height,Math.random()*6+2,0,Math.PI*2);ctx.fill();}
if(elapsed<duration)requestAnimationFrame(drawConfetti);}
requestAnimationFrame(drawConfetti);}
spinWheel.addEventListener("click",()=>{
if(!checkSpinAvailable()){document.getElementById("spinMessage").textContent="⏱ You can only spin once every 24h!";return;}
if(spinningWheel)return;
spinningWheel=true;localStorage.setItem("lastSpinTime",Date.now());
const reward=weightedRandom();const fullRotations=6;
const segIndex=wheelSegments.findIndex(s=>s.reward.name===reward.name);
let startAngle=0;for(let i=0;i<segIndex;i++)startAngle+=wheelSegments[i].weight/100*360;
const targetRotation=360*fullRotations+startAngle+Math.random()*(wheelSegments[segIndex].weight/100*360);
let currentRotation=0;const duration=4000;const startTime=performance.now();
function animate(time){const elapsed=time-startTime;const progress=Math.min(elapsed/duration,1);
currentRotation=targetRotation*easeOutQuart(progress);spinWheel.style.transform=`rotate(${currentRotation}deg)`;
if(progress<1)requestAnimationFrame(animate);
else{spinningWheel=false;document.getElementById("spinMessage").textContent=`🎉 You won: ${reward.name}!`;
let mc=document.getElementById("mcName").value||"Unknown";cart.push({name:reward.name,qty:1,price:0,mc});localStorage.setItem("cart",JSON.stringify(cart));
showLiveSale(mc,reward.name);createConfetti();renderCart();}}
requestAnimationFrame(animate);
});

// ================== INIT ==================
renderCategory("crates");
</script>
</body>
</html>
