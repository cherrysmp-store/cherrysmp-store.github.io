<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherrySMP Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- CONFETTI LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
/* SPINNING WHEEL */
.spin-section .buy{
  /* ...existing styles... */
}

/* -------------------- TOAST NOTIFICATIONS -------------------- */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(0);
  background: linear-gradient(90deg, #ff2d6f, #ff7eb3);
  color: #fff;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: 25px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  transition: all 0.5s ease;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(-20px);
}

.toast.hide {
  opacity: 0;
  transform: translateX(-50%) translateY(0);
}
  
:root{
  --primary:#ff2d6f;
  --secondary:#ff7eb3;
  --accent:#ff9ec9;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(-45deg,#ff2d6f,#7b2ff7,#ff7eb3,#ff2d6f);
  background-size:400% 400%;
  animation:gradient 18s ease infinite;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}
@keyframes gradient{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* SALE BANNER */
#saleBanner{
  background:linear-gradient(90deg,#ff2d6f,#ff7eb3);
  padding:10px;
  text-align:center;
  font-weight:700;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 8%;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
nav ul{display:flex;gap:30px;list-style:none;}
nav a{color:white;text-decoration:none;font-weight:600;}
nav a:hover{color:var(--accent);}

/* HERO */
.hero{text-align:center;padding:80px 20px 40px;}
.hero h2{font-size:48px;font-weight:800;}
.hero p{margin-top:10px;opacity:0.85;}

/* CATEGORIES */
.categories{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:20px 8%;
}
.category-btn{
  padding:12px 24px;
  border-radius:50px;
  border:none;
  font-weight:700;
  cursor:pointer;
  background:var(--glass);
  backdrop-filter:blur(20px);
  color:#fff;
  border:1px solid var(--border);
}
.category-btn.active,
.category-btn:hover{
  background:linear-gradient(90deg,var(--primary),var(--secondary));
}

/* PRODUCTS */
.products{padding:20px 8% 80px;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}
.card{
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(25px);
  border-radius:20px;
  padding:20px;
  display:flex;
  flex-direction:column;
  position:relative;
}
.card:hover{transform:translateY(-5px);}
.price{font-size:20px;font-weight:800;margin-top:auto;}
.buy{
  margin-top:10px;
  padding:8px;
  border-radius:10px;
  border:none;
  font-weight:700;
  cursor:pointer;
  background:var(--primary);
  color:white;
}
.buy:hover{
  background:var(--secondary);
  box-shadow: 0 0 20px #ff2d6f, 0 0 40px #ff7eb3;
  transform: scale(1.05);
}
.popular-badge{
  background:linear-gradient(90deg,#ff2d6f,#ff7eb3);
  padding:4px 10px;
  border-radius:12px;
  font-size:12px;
  font-weight:700;
  margin-bottom:10px;
  display:inline-block;
}

/* CART MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}
.modal.active{
  opacity:1;
  pointer-events:auto;
}
.modal-content{
  background:#111118;
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:450px;
}
.close{
  margin-top:15px;
  padding:8px 20px;
  border:none;
  border-radius:10px;
  background:#444;
  color:#fff;
  cursor:pointer;
}

/* STATS */
.stats{padding:60px 8%;text-align:center;}
.stats h2{font-size:36px;margin-bottom:30px;}
.stat-grid{display:flex;justify-content:center;gap:50px;flex-wrap:wrap;}
.stat-grid div h3{font-size:28px;margin-bottom:5px;}
footer{text-align:center;padding:30px;opacity:0.6;}

/* MOBILE MENU */
@media (max-width:768px){
  nav ul{
    display:none;
    flex-direction:column;
    background:rgba(0,0,0,0.85);
    position:absolute;
    top:70px;
    right:0;
    width:200px;
    padding:20px;
    border-radius:10px;
    z-index:100;
  }
  nav ul.show{
    display:flex;
  }
  #mobileMenuBtn{
    display:block;
    background:none;
    border:none;
    color:#fff;
    font-size:28px;
    cursor:pointer;
  }
}

/* QUANTITY SELECTOR */
.qty-select{
  padding:5px 10px;
  border-radius:8px;
  border:none;
  font-weight:600;
  background:rgba(255,255,255,0.1);
  color:#fff;
}

/* SPINNING WHEEL */
.spin-section .buy{
  padding:12px 25px;
  border-radius:15px;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(90deg,#ff2d6f,#ff7eb3);
  border:none;
  color:#fff;
  transition:0.3s;
}
.spin-section .buy:hover{
  background:linear-gradient(90deg,#ff7eb3,#ff7eb3);
}
</style>
</head>
<body>

<div id="saleBanner">🔥 SUMMER SALE - 20% OFF EVERYTHING | Use Code: CHERRY20</div>

<nav>
  <h1>CherrySMP Store</h1>
  <button id="mobileMenuBtn">☰</button>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">Support</a></li>
    <li style="position:relative;">
      <a href="#" id="cartBtn">🛒 Cart</a>
      <span id="cartCount" style="position:absolute;top:-8px;right:-15px;background:#ff2d6f;padding:3px 8px;border-radius:20px;font-size:12px;">0</span>
    </li>
  </ul>
</nav>

<!-- SPINNING WHEEL -->
<section class="spin-section" style="text-align:center;padding:40px;">
  <h2>🎡 Spin to Win!</h2>
  <div id="wheelContainer" style="position:relative; width:300px; height:300px; margin:20px auto;">
    <canvas id="wheelCanvas" width="300" height="300"></canvas>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:700;color:#fff;pointer-events:none;">SPIN</div>
    <!-- Pointer Arrow -->
    <div style="
      position:absolute;
      top:-10px;
      left:50%;
      transform:translateX(-50%);
      width:0; 
      height:0; 
      border-left:15px solid transparent;
      border-right:15px solid transparent;
      border-bottom:25px solid #fff;
      z-index:10;
    "></div>
  </div>
  <button id="spinWheel" class="buy">Spin Now</button>
  <p id="spinResult" style="margin-top:15px;font-weight:700;"></p>
</section>

<!-- CATEGORIES -->
<section class="categories">
  <button class="category-btn active" data-category="crates">Crates</button>
  <button class="category-btn" data-category="ranks">Ranks</button>
  <button class="category-btn" data-category="credits">Credits</button>
  <button class="category-btn" data-category="spawners">Spawners</button>
  <button class="category-btn" data-category="bundles">Bundles</button>
</section>

<!-- PRODUCTS -->
<section class="products">
<div class="grid" id="productGrid"></div>
</section>

<!-- STATS -->
<section class="stats">
<h2>Server Stats</h2>
<div class="stat-grid">
<div><h3 class="stat" data-target="1250">0</h3><p>Players</p></div>
<div><h3 class="stat" data-target="5000">0</h3><p>Purchases</p></div>
<div><h3 class="stat" data-target="99.9">0</h3><p>% Uptime</p></div>
</div>
</section>

<footer>© 2026 CherrySMP • Not affiliated with Mojang</footer>

<!-- CART MODAL -->
<div class="modal" id="cartModal">
<div class="modal-content">
<h2>Your Cart</h2>
<input type="text" id="mcUsername" placeholder="Enter Minecraft Username" style="width:100%;padding:10px;margin-bottom:10px;border-radius:10px;border:none;">
<div id="cartItems" style="max-height:200px;overflow-y:auto;margin-bottom:10px;"></div>
<input type="text" id="discountCode" placeholder="Discount Code" style="width:100%;padding:10px;margin-bottom:10px;border-radius:10px;border:none;">
<button id="applyDiscount" class="buy" style="width:100%;">Apply Code</button>
<h3 style="margin-top:10px;">Total: €<span id="cartTotal">0.00</span></h3>
<a id="paypalCheckout" href="#" target="_blank">
<button class="buy" style="width:100%;margin-top:10px;">Pay with PayPal</button>
</a>
<button class="close" id="closeCart">Close</button>
</div>
</div>

<!-- SOUNDS -->
<audio id="spinSound" src="https://freesound.org/data/previews/341/341695_6242704-lq.mp3"></audio>
<audio id="addCartSound" src="https://freesound.org/data/previews/402/402112_5121236-lq.mp3"></audio>
<audio id="tickSound" src="https://freesound.org/data/previews/66/66717_634166-lq.mp3"></audio>

<script>
<script>
// -------------------- STORE DATA & VARIABLES --------------------
const storeData = {
  crates:[
    {name:"Snow Key",price:0.19,desc:"Unlock Snow Crates!"},
    {name:"Ocean Key",price:0.49,desc:"Unlock Ocean Crates!"},
    {name:"Slime Key",price:0.99,desc:"Unlock Slime Crates!"},
    {name:"Maple Key",price:1.79,desc:"Unlock Maple Crates!"},
    {name:"Cherry Key",price:2.49,desc:"Unlock Cherry Crates!",popular:true}
  ],
  ranks:[
    {name:"VIP (Lifetime)",price:2},
    {name:"Maple (Lifetime)",price:4},
    {name:"Cherry (Lifetime)",price:7},
    {name:"Cherry+ (Lifetime)",price:10,popular:true},
    {name:"VIP (30d)",price:1},
    {name:"Maple (30d)",price:2},
    {name:"Cherry (30d)",price:3.5,popular:true},
    {name:"Cherry+ (30d)",price:5}
  ],
  credits:[
    {name:"100x Credits",price:1},
    {name:"250x Credits",price:2.29},
    {name:"500x Credits",price:4.69},
    {name:"1000x Credits",price:9.19,popular:true},
    {name:"2500x Credits",price:23.5}
  ],
  spawners:[
    {name:"Skeleton",price:0.05,desc:"Spawn Skeleton x1"},
    {name:"Blaze",price:0.03,desc:"Spawn Blaze x1"},
    {name:"Creeper",price:0.04,desc:"Spawn Creeper x1"},
    {name:"Iron Golem",price:0.07,desc:"Spawn Iron Golem x1"}
  ],
  bundles:[
    {name:"Starter Bundle",price:3.99,desc:"VIP Lifetime + 2 Snow Keys"},
    {name:"Maple Bundle",price:6.99,desc:"Maple Lifetime + 2 Maple Keys"},
    {name:"Cherry Elite Bundle",price:11.99,desc:"Cherry Lifetime + 5 Cherry Keys"},
    {name:"Ultimate Supporter",price:19.99,desc:"Cherry+ 30d + 10 Cherry Keys + 1000 Credits"}
  ]
};

let cart = [];
let discount = 0;
const discountCodes = {"CHERRY20":20,"VIP10":10};
const grid = document.getElementById("productGrid");
const cartModal = document.getElementById("cartModal");
const cartBtn = document.getElementById("cartBtn");
const closeCart = document.getElementById("closeCart");
const cartItems = document.getElementById("cartItems");
const cartTotal = document.getElementById("cartTotal");
const cartCount = document.getElementById("cartCount");
const categoryIcons = { crates:"📦", ranks:"💎", credits:"💰", spawners:"⚔️", bundles:"🎁" };
const spinSound = document.getElementById("spinSound");
const addCartSound = document.getElementById("addCartSound");
const tickSound = document.getElementById("tickSound");

// -------------------- TOAST NOTIFICATIONS --------------------
function showToast(msg){
  const toast=document.createElement("div");
  toast.className="toast";
  toast.textContent=msg;
  toast.style.position="fixed";
  toast.style.bottom="20px";
  toast.style.left="50%";
  toast.style.transform="translateX(-50%)";
  toast.style.background="#ff2d6f";
  toast.style.color="#fff";
  toast.style.padding="10px 20px";
  toast.style.borderRadius="15px";
  toast.style.fontWeight="700";
  toast.style.opacity="0";
  toast.style.transition="0.5s";
  toast.style.zIndex="9999";
  document.body.appendChild(toast);
  setTimeout(()=>{toast.style.opacity="1"; toast.style.bottom="40px";},10);
  setTimeout(()=>{toast.style.opacity="0"; toast.style.bottom="20px"; setTimeout(()=>toast.remove(),500);},2000);
}

// -------------------- LOAD/SAVE CART WITH DISCOUNT --------------------
function loadCart(){
  const stored = localStorage.getItem("cherryCart");
  if(stored) cart = JSON.parse(stored);
  const savedDiscount = localStorage.getItem("cherryDiscount");
  if(savedDiscount) discount = parseInt(savedDiscount);
}
function saveCart(){
  localStorage.setItem("cherryCart", JSON.stringify(cart));
  localStorage.setItem("cherryDiscount", discount);
}
loadCart();

// -------------------- CART --------------------
function addToCart(product, qty=1){
  let existing = cart.find(i=>i.name===product.name);
  if(existing) existing.qty += qty;
  else cart.push({...product, qty});
  updateCart();
  saveCart();
  showToast(`${product.name} x${qty} added to cart!`);
}

function updateCart(){
  cartItems.innerHTML="";
  let total=0;
  cart.forEach((item,i)=>{
    total+=item.price*item.qty;
    cartItems.innerHTML+=`<div style="display:flex;justify-content:space-between;margin:5px 0;">
      <span>${item.name} x${item.qty}</span>
      <div>
        <button onclick="changeQty(${i},-1)">-</button>
        <button onclick="changeQty(${i},1)">+</button>
      </div>
    </div>`;
  });
  total = total*(1-discount/100);
  cartTotal.textContent = total.toFixed(2);
  cartCount.textContent = cart.reduce((a,b)=>a+b.qty,0);
  document.getElementById("paypalCheckout").href=`https://www.paypal.com/paypalme/YOURNAME/${total.toFixed(2)}`;
}

function changeQty(i, amt){
  cart[i].qty+=amt;
  if(cart[i].qty<=0) cart.splice(i,1);
  updateCart(); saveCart();
}

// -------------------- PRODUCTS --------------------
function renderCategory(category){
  grid.innerHTML="";
  storeData[category].forEach(product=>{
    let price = product.price*(1-discount/100);
    const card = document.createElement("div");
    card.classList.add("card");

    let qtyHTML="";
    if(category==="crates" || category==="spawners"){
      qtyHTML=`<div class="qty-buttons">
        <button class="qty-btn active" data-qty="1">1×</button>
        <button class="qty-btn" data-qty="5">5×</button>
        <button class="qty-btn" data-qty="10">10×</button>
        <button class="qty-btn" data-qty="20">20×</button>
      </div>`;
    }

    card.innerHTML=`${product.popular?'<span class="popular-badge">⭐ MOST POPULAR</span>':''}
      <h3 title="${product.desc}">${product.name}</h3>
      <p>${product.desc||"Premium server item"}</p>
      ${discount>0?`<div style="text-decoration:line-through;opacity:0.6;">€${product.price.toFixed(2)}</div>`:""}
      <div class="price">€${price.toFixed(2)}</div>
      ${qtyHTML}
      <button class="buy">Add to Cart</button>
    `;
    
    const buyBtn = card.querySelector(".buy");
    let selectedQty=1;
    const qtyButtons = card.querySelectorAll(".qty-btn");
    qtyButtons.forEach(btn=>{
      btn.onclick = ()=>{
        qtyButtons.forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        selectedQty=parseInt(btn.dataset.qty);
      };
    });
    buyBtn.onclick = ()=>{ addToCart(product, selectedQty); showAddToCartFeedback(buyBtn); };
    grid.appendChild(card);
  });
}

// -------------------- POPULAR BADGE PULSE --------------------
const style = document.createElement("style");
style.innerHTML = `
.popular-badge{
  animation: pulse 1.5s infinite;
}
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.15);}
  100%{transform:scale(1);}
}`;
document.head.appendChild(style);

// -------------------- SPINNING WHEEL WITH DAILY LIMIT & CART REWARD --------------------
const canvas=document.getElementById("wheelCanvas");
const ctx=canvas.getContext("2d");
const spinBtn=document.getElementById("spinWheel");
const spinResult=document.getElementById("spinResult");
const prizes=["10 Credits","5 Credits","VIP Key","Nothing","100 Credits","Snow Key"];
const colors=["#ff2d6f","#ff7eb3","#ff9ec9","#7b2ff7","#ff6e8c","#ff90c1"];
let spinning=false;

function drawWheel(angle=0){
  const center=canvas.width/2;
  const radius=center-10;
  const sliceAngle=(2*Math.PI)/prizes.length;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<prizes.length;i++){
    ctx.beginPath();
    ctx.moveTo(center,center);
    ctx.arc(center,center,radius,i*sliceAngle+angle,(i+1)*sliceAngle+angle);
    const grad=ctx.createRadialGradient(center,center,radius/3,center,center,radius);
    grad.addColorStop(0,colors[i%colors.length]);
    grad.addColorStop(1,"#111118");
    ctx.fillStyle=grad; ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();
    ctx.save();
    ctx.translate(center,center);
    ctx.rotate(i*sliceAngle+sliceAngle/2+angle);
    ctx.textAlign="right"; ctx.fillStyle="#fff"; ctx.font="bold 14px sans-serif";
    ctx.fillText(prizes[i],radius-10,5);
    ctx.restore();
  }
}

spinBtn.onclick=()=>{
  if(spinning) return;
  const lastSpin=localStorage.getItem("lastSpinDate");
  const today=new Date().toDateString();
  if(lastSpin===today){ showToast("You can only spin once per day!"); return; }

  spinning=true;
  spinSound.currentTime=0; spinSound.play();
  const spins=Math.floor(Math.random()*3)+5;
  const selectedPrize=prizes[Math.floor(Math.random()*prizes.length)];
  const degPerPrize=360/prizes.length;
  const prizeIndex=prizes.indexOf(selectedPrize);
  const finalDeg=360*spins - prizeIndex*degPerPrize - degPerPrize/2;
  const duration=4000;
  const start=performance.now();
  animate.lastSlice=-1;

  function animate(t){
    const elapsed=t-start;
    const progress=Math.min(elapsed/duration,1);
    const eased=1-Math.pow(1-progress,3);
    const current=eased*finalDeg*(Math.PI/180);
    drawWheel(current);
    const sliceAngle=2*Math.PI/prizes.length;
    const slicePassed=Math.floor(current/sliceAngle);
    if(slicePassed!==animate.lastSlice){
      tickSound.currentTime=0; tickSound.play();
      animate.lastSlice=slicePassed;
    }
    if(progress<1) requestAnimationFrame(animate);
    else{
      spinning=false;
      confetti({particleCount:100,spread:70,origin:{y:0.6}});
      spinResult.textContent=`🎉 You won: ${selectedPrize}!`;
      localStorage.setItem("lastSpinDate", today);
      showToast(`You won: ${selectedPrize}!`);

      // Add prize to cart if it exists
      for(const cat in storeData){
        const item=storeData[cat].find(i=>i.name.toLowerCase().includes(selectedPrize.toLowerCase()));
        if(item){ addToCart(item,1); break; }
      }
    }
  }
  requestAnimationFrame(animate);
};

// -------------------- CHECKOUT CONFIRMATION MODAL --------------------
document.getElementById("paypalCheckout").onclick=e=>{
  e.preventDefault();
  if(!document.getElementById("mcUsername").value.trim()){ showToast("Enter Minecraft username."); return; }
  if(cart.length===0){ showToast("Cart is empty."); return; }

  const modal=document.createElement("div");
  modal.style.position="fixed";
  modal.style.inset="0";
  modal.style.background="rgba(0,0,0,0.9)";
  modal.style.display="flex";
  modal.style.alignItems="center";
  modal.style.justifyContent="center";
  modal.style.zIndex="9999";

  const content=document.createElement("div");
  content.style.background="#222";
  content.style.padding="25px";
  content.style.borderRadius="20px";
  content.style.color="#fff";
  content.style.textAlign="center";
  content.innerHTML=`
    <h2>Confirm Your Order</h2>
    <p>Minecraft Username: <strong>${document.getElementById("mcUsername").value}</strong></p>
    <ul>${cart.map(i=>`<li>${i.name} x${i.qty}</li>`).join("")}</ul>
    <p>Total: €${(cart.reduce((a,b)=>a+b.price*b.qty,0)*(1-discount/100)).toFixed(2)}</p>
    <button id="confirmOrder" class="buy" style="margin-top:15px;">Confirm</button>
    <button id="cancelOrder" class="close" style="margin-top:10px;">Cancel</button>
  `;
  modal.appendChild(content);
  document.body.appendChild(modal);

  document.getElementById("cancelOrder").onclick=()=>{ modal.remove(); };
  document.getElementById("confirmOrder").onclick=()=>{
    showToast("Order confirmed! Check your email for details.");
    cart=[]; discount=0; updateCart(); saveCart();
    modal.remove();
  };
};
</script>
</script>
</body>
</html>
