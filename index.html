<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherrySMP Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* ============================================================
   CHERRYSMP STORE FULL EXTENDED VERSION (650+ LINES)
   Fully expanded with comments and sections
   Designed to feel alive and premium
============================================================ */

/* ============================================================
   ROOT VARIABLES
============================================================ */
:root {
  --primary: #ff2d6f;
  --secondary: #ff7eb3;
  --accent: #ff9ec9;
  --dark: #0e0e14;
  --glass: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.08);
  --highlight: #fff176;
  --success: #6eff9e;
}

/* ============================================================
   GLOBAL RESET
============================================================ */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* ============================================================
   BODY
============================================================ */
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(-45deg,#ff2d6f,#7b2ff7,#ff7eb3,#ff2d6f);
  background-size:400% 400%;
  animation:gradient 18s ease infinite;
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* Animated gradient */
@keyframes gradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ============================================================
   NAVBAR
============================================================ */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 8%;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(20px);
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid var(--border);
}

nav h1{
  font-size:26px;
  font-weight:800;
}

nav ul{
  list-style:none;
  display:flex;
  gap:30px;
}

nav a{
  text-decoration:none;
  color:white;
  font-weight:600;
  transition:0.3s;
}

nav a:hover{
  color:var(--accent);
}

/* ============================================================
   HERO
============================================================ */
.hero{
  text-align:center;
  padding:120px 20px 80px;
}

.hero h2{
  font-size:60px;
  font-weight:800;
}

.hero p{
  opacity:0.85;
  margin-top:10px;
}

.hero input{
  margin-top:20px;
  padding:12px 15px;
  border-radius:10px;
  border:none;
  outline:none;
  text-align:center;
  width:260px;
  font-size:16px;
  transition:0.3s;
}

.hero input:focus{
  box-shadow:0 0 15px var(--accent);
}

/* ============================================================
   CATEGORY BUTTONS
============================================================ */
.categories{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:40px 8%;
}

.category-btn{
  padding:14px 28px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  font-weight:700;
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  color:white;
  transition:0.3s;
}

.category-btn:hover,
.category-btn.active{
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  transform:scale(1.1);
}

/* ============================================================
   PRODUCT GRID
============================================================ */
.products{
  padding:40px 8% 80px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}

/* ============================================================
   CARD
============================================================ */
.card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:20px;
  padding:30px;
  backdrop-filter:blur(20px);
  transition:0.4s;
  display:flex;
  flex-direction:column;
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
  box-shadow:0 0 30px rgba(255,255,255,0.2);
}

.card h3{
  font-size:22px;
}

.price{
  font-size:20px;
  font-weight:800;
  margin-top:auto;
}

.buy{
  margin-top:15px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}

.buy:hover{
  background:var(--secondary);
}

/* ============================================================
   QUANTITY BUTTONS
============================================================ */
.qty-btn{
  padding:6px 12px;
  margin:5px 5px 5px 0;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.qty-btn:hover{
  background:var(--accent);
}

/* ============================================================
   TOP CUSTOMERS & RECENT ORDERS
============================================================ */
.panel{
  margin:40px 8%;
  padding:25px;
  border-radius:15px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
}

.panel h3{
  text-align:center;
  margin-bottom:15px;
}

.panel ul{
  list-style:none;
}

.panel li{
  padding:6px 0;
  border-bottom:1px solid var(--border);
}

/* ============================================================
   LIVE SALES POPUP
============================================================ */
.live-sale{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:15px 20px;
  border-radius:12px;
  opacity:0;
  transform:translateY(20px);
  transition:0.5s;
  z-index:9999;
}

.live-sale.active{
  opacity:1;
  transform:translateY(0);
}

/* ============================================================
   FOOTER
============================================================ */
footer{
  text-align:center;
  padding:40px;
  opacity:0.6;
}

</style>
</head>
<body>

<nav>
<h1>CherrySMP Store</h1>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Support</a></li>
<li><a href="#" onclick="openCart()">Cart 🛒</a></li>
</ul>
</nav>

<section class="hero">
<h2>Premium Server Store</h2>
<p>Support the server and unlock exclusive perks</p>
<input type="text" id="mcName" placeholder="Enter your Minecraft username">
</section>

<section class="categories">
<button class="category-btn active" data-category="crates">Crates</button>
<button class="category-btn" data-category="ranks">Ranks</button>
<button class="category-btn" data-category="credits">Credits</button>
<button class="category-btn" data-category="spawners">Spawners</button>
<button class="category-btn" data-category="bundles">Bundles</button>
</section>

<section class="products">
<div class="grid" id="productGrid"></div>
</section>

<div class="panel">
<h3>🏆 Top Customers</h3>
<ul id="topCustomers"></ul>
</div>

<div class="panel">
<h3>🧾 Recent Orders</h3>
<ul id="recentOrders"></ul>
</div>

<div class="live-sale" id="liveSale"></div>

<footer>
© 2026 CherrySMP • Not affiliated with Mojang
</footer>

<script>

/* ============================================================
   STORE DATA
============================================================ */

const storeData = {

crates:[
{name:"Snow Key",price:0.19},
{name:"Ocean Key",price:0.49},
{name:"Slime Key",price:0.99},
{name:"Maple Key",price:1.79},
{name:"Cherry Key",price:2.49}
],

ranks:[
{name:"VIP (Lifetime)",price:2},
{name:"Maple (Lifetime)",price:4},
{name:"Cherry (Lifetime)",price:7},
{name:"Cherry+ (Lifetime)",price:10},
{name:"VIP (30d)",price:1},
{name:"Maple (30d)",price:2},
{name:"Cherry (30d)",price:3.5},
{name:"Cherry+ (30d)",price:5}
],

credits:[
{name:"100x Credits",price:1},
{name:"250x Credits",price:2.29},
{name:"500x Credits",price:4.69},
{name:"1000x Credits",price:9.19},
{name:"2500x Credits",price:23.50}
],

spawners:[
{name:"Blaze",price:0.03},
{name:"Creeper",price:0.04},
{name:"Skeleton",price:0.05},
{name:"Iron Golem",price:0.07}
],

bundles:[
{name:"Starter Bundle",price:1.99},
{name:"Maple Bundle",price:6.99},
{name:"Cherry Elite Bundle",price:11.99},
{name:"Ultimate Supporter",price:19.99}
]

};

// Sort cheapest → richest
for(let category in storeData){
storeData[category].sort((a,b)=>a.price-b.price);
}

/* ============================================================
   VARIABLES
============================================================ */

let cart=[];
let topCustomers={};
let recentOrders=[];

/* ============================================================
   RENDER PRODUCTS
============================================================ */

const grid=document.getElementById("productGrid");

function renderCategory(category){

grid.innerHTML="";

storeData[category].forEach(product=>{

let card=document.createElement("div");
card.className="card";

let qtyButtons="";
let quantities=[1,3,5,10];

if(category==="spawners"){
quantities=[1,3,5,25];
}

if(category==="spawners"||category==="crates"||category==="credits"){
qtyButtons="<div>";
quantities.forEach(q=>{
qtyButtons+=`<button class="qty-btn">${q}x</button>`;
});
qtyButtons+="</div>";
}

card.innerHTML=`
<h3>${product.name}</h3>
<p>Premium server item</p>
<div class="price">${product.price.toFixed(2)}€</div>
${qtyButtons}
<button class="buy">Add to Cart</button>
`;

let selectedQty=1;
let priceDiv=card.querySelector(".price");

card.querySelectorAll(".qty-btn").forEach(btn=>{
btn.addEventListener("click",()=>{
selectedQty=parseInt(btn.textContent);
priceDiv.textContent=(product.price*selectedQty).toFixed(2)+"€";
});
});

card.querySelector(".buy").addEventListener("click",()=>{
let mc=document.getElementById("mcName").value || "Unknown";
cart.push({name:product.name,qty:selectedQty,price:product.price,mc:mc});
showLiveSale(mc,product.name);
});

grid.appendChild(card);

});

}

/* ============================================================
   CATEGORY SWITCH
============================================================ */

document.querySelectorAll(".category-btn").forEach(btn=>{
btn.addEventListener("click",()=>{
document.querySelectorAll(".category-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
renderCategory(btn.dataset.category);
});
});

/* ============================================================
   COMPLETE ORDER (Simulated Checkout)
============================================================ */

function completeOrder(){

cart.forEach(item=>{

// Top customer tracking
if(topCustomers[item.mc]){
topCustomers[item.mc]+=item.qty;
}else{
topCustomers[item.mc]=item.qty;
}

// Recent orders tracking
recentOrders.unshift(`${item.mc} bought ${item.qty}x ${item.name}`);
if(recentOrders.length>8){
recentOrders.pop();
}

});

updateTopCustomers();
updateRecentOrders();
cart=[];
}

/* ============================================================
   UPDATE UI
============================================================ */

function updateTopCustomers(){
let list=document.getElementById("topCustomers");
list.innerHTML="";
Object.entries(topCustomers)
.sort((a,b)=>b[1]-a[1])
.slice(0,5)
.forEach(entry=>{
let li=document.createElement("li");
li.textContent=`${entry[0]} - ${entry[1]} items`;
list.appendChild(li);
});
}

function updateRecentOrders(){
let list=document.getElementById("recentOrders");
list.innerHTML="";
recentOrders.forEach(order=>{
let li=document.createElement("li");
li.textContent=order;
list.appendChild(li);
});
}

/* ============================================================
   LIVE SALE POPUP
============================================================ */

function showLiveSale(player,item){
let popup=document.getElementById("liveSale");
popup.textContent=`🔥 ${player} just added ${item} to cart!`;
popup.classList.add("active");
setTimeout(()=>popup.classList.remove("active"),4000);
}

/* ============================================================
   AUTO COMPLETE BUTTON FOR DEMO
============================================================ */

setInterval(()=>{
if(cart.length>0){
completeOrder();
}
},15000);

/* ============================================================
   INIT
============================================================ */

renderCategory("crates");

</script>
</body>
</html>
