<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherrySMP Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- CONFETTI LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root{
  --primary:#ff2d6f;
  --secondary:#ff7eb3;
  --accent:#ff9ec9;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(-45deg,#ff2d6f,#7b2ff7,#ff7eb3,#ff2d6f);
  background-size:400% 400%;
  animation:gradient 18s ease infinite;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}
@keyframes gradient{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* SALE BANNER */
#saleBanner{
  background:linear-gradient(90deg,#ff2d6f,#ff7eb3);
  padding:10px;
  text-align:center;
  font-weight:700;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 8%;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
nav ul{display:flex;gap:30px;list-style:none;}
nav a{color:white;text-decoration:none;font-weight:600;}
nav a:hover{color:var(--accent);}

/* HERO */
.hero{text-align:center;padding:80px 20px 40px;}
.hero h2{font-size:48px;font-weight:800;}
.hero p{margin-top:10px;opacity:0.85;}

/* CATEGORIES */
.categories{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:20px 8%;
}
.category-btn{
  padding:12px 24px;
  border-radius:50px;
  border:none;
  font-weight:700;
  cursor:pointer;
  background:var(--glass);
  backdrop-filter:blur(20px);
  color:#fff;
  border:1px solid var(--border);
}
.category-btn.active,
.category-btn:hover{
  background:linear-gradient(90deg,var(--primary),var(--secondary));
}

/* PRODUCTS */
.products{padding:20px 8% 80px;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}
.card{
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(25px);
  border-radius:20px;
  padding:20px;
  display:flex;
  flex-direction:column;
  position:relative;
}
.card:hover{transform:translateY(-5px);}
.price{font-size:20px;font-weight:800;margin-top:auto;}
.buy{
  margin-top:10px;
  padding:8px;
  border-radius:10px;
  border:none;
  font-weight:700;
  cursor:pointer;
  background:var(--primary);
  color:white;
  transition:0.3s;
}
.buy:hover{
  background:var(--secondary);
  box-shadow: 0 0 20px #ff2d6f, 0 0 40px #ff7eb3;
  transform: scale(1.05);
}
.popular-badge{
  background:linear-gradient(90deg,#ff2d6f,#ff7eb3);
  padding:4px 10px;
  border-radius:12px;
  font-size:12px;
  font-weight:700;
  margin-bottom:10px;
  display:inline-block;
  animation: pulse 1.5s infinite;
}
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.15);}
  100%{transform:scale(1);}
}

/* CART MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:1000;
}
.modal.active{
  opacity:1;
  pointer-events:auto;
}
.modal-content{
  background:#111118;
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:450px;
}
.close{
  margin-top:15px;
  padding:8px 20px;
  border:none;
  border-radius:10px;
  background:#444;
  color:#fff;
  cursor:pointer;
}

/* STATS */
.stats{padding:60px 8%;text-align:center;}
.stats h2{font-size:36px;margin-bottom:30px;}
.stat-grid{display:flex;justify-content:center;gap:50px;flex-wrap:wrap;}
.stat-grid div h3{font-size:28px;margin-bottom:5px;}
footer{text-align:center;padding:30px;opacity:0.6;}

/* MOBILE MENU */
@media (max-width:768px){
  nav ul{
    display:none;
    flex-direction:column;
    background:rgba(0,0,0,0.85);
    position:absolute;
    top:70px;
    right:0;
    width:200px;
    padding:20px;
    border-radius:10px;
    z-index:100;
  }
  nav ul.show{
    display:flex;
  }
  #mobileMenuBtn{
    display:block;
    background:none;
    border:none;
    color:#fff;
    font-size:28px;
    cursor:pointer;
  }
}

/* QUANTITY SELECTOR */
.qty-select{
  padding:5px 10px;
  border-radius:8px;
  border:none;
  font-weight:600;
  background:rgba(255,255,255,0.1);
  color:#fff;
}

/* SPINNING WHEEL */
.spin-section .buy{
  padding:12px 25px;
  border-radius:15px;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(90deg,#ff2d6f,#ff7eb3);
  border:none;
  color:#fff;
  transition:0.3s;
}
.spin-section .buy:hover{
  background:linear-gradient(90deg,#ff7eb3,#ff7eb3);
}

/* TOAST NOTIFICATIONS */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(0);
  background:linear-gradient(90deg,#ff2d6f,#ff7eb3);
  color:#fff;
  font-family:'Inter',sans-serif;
  font-weight:700;
  padding:12px 24px;
  border-radius:25px;
  box-shadow:0 4px 15px rgba(0,0,0,0.4);
  opacity:0;
  pointer-events:none;
  z-index:9999;
  transition:all 0.5s ease;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(-20px);
}
.toast.hide{
  opacity:0;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div id="saleBanner">🔥 SUMMER SALE - 20% OFF EVERYTHING | Use Code: CHERRY20</div>

<nav>
<h1>CherrySMP Store</h1>
<button id="mobileMenuBtn">☰</button>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Support</a></li>
<li style="position:relative;">
  <a href="#" id="cartBtn">🛒 Cart</a>
  <span id="cartCount" style="position:absolute;top:-8px;right:-15px;background:#ff2d6f;padding:3px 8px;border-radius:20px;font-size:12px;">0</span>
</li>
</ul>
</nav>

<section class="spin-section" style="text-align:center;padding:40px;">
<h2>🎡 Spin to Win!</h2>
<div id="wheelContainer" style="position:relative;width:300px;height:300px;margin:20px auto;">
<canvas id="wheelCanvas" width="300" height="300"></canvas>
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:700;color:#fff;pointer-events:none;">SPIN</div>
<div style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:25px solid #fff;z-index:10;"></div>
</div>
<button id="spinWheel" class="buy">Spin Now</button>
<p id="spinResult" style="margin-top:15px;font-weight:700;"></p>
</section>

<section class="categories">
<button class="category-btn active" data-category="crates">Crates</button>
<button class="category-btn" data-category="ranks">Ranks</button>
<button class="category-btn" data-category="credits">Credits</button>
<button class="category-btn" data-category="spawners">Spawners</button>
<button class="category-btn" data-category="bundles">Bundles</button>
</section>

<section class="products">
<div class="grid" id="productGrid"></div>
</section>

<section class="stats">
<h2>Server Stats</h2>
<div class="stat-grid">
<div><h3 class="stat" data-target="1250">0</h3><p>Players</p></div>
<div><h3 class="stat" data-target="5000">0</h3><p>Purchases</p></div>
<div><h3 class="stat" data-target="99.9">0</h3><p>% Uptime</p></div>
</div>
</section>

<footer>© 2026 CherrySMP • Not affiliated with Mojang</footer>

<div class="modal" id="cartModal">
<div class="modal-content">
<h2>Your Cart</h2>
<input type="text" id="mcUsername" placeholder="Enter Minecraft Username" style="width:100%;padding:10px;margin-bottom:10px;border-radius:10px;border:none;">
<div id="cartItems" style="max-height:200px;overflow-y:auto;margin-bottom:10px;"></div>
<input type="text" id="discountCode" placeholder="Discount Code" style="width:100%;padding:10px;margin-bottom:10px;border-radius:10px;border:none;">
<button id="applyDiscount" class="buy" style="width:100%;">Apply Code</button>
<h3 style="margin-top:10px;">Total: €<span id="cartTotal">0.00</span></h3>
<a id="paypalCheckout" href="#" target="_blank">
<button class="buy" style="width:100%;margin-top:10px;">Pay with PayPal</button>
</a>
<button class="close" id="closeCart">Close</button>
</div>
</div>

<audio id="spinSound" src="https://freesound.org/data/previews/341/341695_6242704-lq.mp3"></audio>
<audio id="addCartSound" src="https://freesound.org/data/previews/402/402112_5121236-lq.mp3"></audio>
<audio id="tickSound" src="https://freesound.org/data/previews/66/66717_634166-lq.mp3"></audio>

<script>
// ================== STORE DATA ==================
const storeData = {
  crates:[
    {name:"Snow Key",price:0.19,desc:"Unlock Snow Crates!"},
    {name:"Ocean Key",price:0.49,desc:"Unlock Ocean Crates!"},
    {name:"Slime Key",price:0.99,desc:"Unlock Slime Crates!"},
    {name:"Maple Key",price:1.79,desc:"Unlock Maple Crates!"},
    {name:"Cherry Key",price:2.49,desc:"Unlock Cherry Crates!",popular:true}
  ],
  ranks:[
    {name:"VIP (Lifetime)",price:2},
    {name:"Maple (Lifetime)",price:4},
    {name:"Cherry (Lifetime)",price:7},
    {name:"Cherry+ (Lifetime)",price:10,popular:true},
    {name:"VIP (30d)",price:1},
    {name:"Maple (30d)",price:2},
    {name:"Cherry (30d)",price:3.5,popular:true},
    {name:"Cherry+ (30d)",price:5}
  ],
  credits:[
    {name:"100x Credits",price:1},
    {name:"250x Credits",price:2.29},
    {name:"500x Credits",price:4.69},
    {name:"1000x Credits",price:9.19,popular:true},
    {name:"2500x Credits",price:23.5}
  ],
  spawners:[
    {name:"Skeleton",price:0.05,desc:"Spawn Skeleton x1"},
    {name:"Blaze",price:0.03,desc:"Spawn Blaze x1"},
    {name:"Creeper",price:0.04,desc:"Spawn Creeper x1"},
    {name:"Iron Golem",price:0.07,desc:"Spawn Iron Golem x1"}
  ],
  bundles:[
    {name:"Starter Bundle",price:3.99,desc:"VIP Lifetime + 2 Snow Keys"},
    {name:"Maple Bundle",price:6.99,desc:"Maple Lifetime + 2 Maple Keys"},
    {name:"Cherry Elite Bundle",price:11.99,desc:"Cherry Lifetime + 5 Cherry Keys"},
    {name:"Ultimate Supporter",price:19.99,desc:"Cherry+ 30d + 10 Cherry Keys + 1000 Credits"}
  ]
};

// ================== GLOBAL VARIABLES ==================
let cart = [];
let discount = 0;
const discountCodes = { "CHERRY20": 20, "VIP10": 10 };
const grid = document.getElementById("productGrid");
const cartModal = document.getElementById("cartModal");
const cartBtn = document.getElementById("cartBtn");
const closeCart = document.getElementById("closeCart");
const cartItems = document.getElementById("cartItems");
const cartTotal = document.getElementById("cartTotal");
const cartCount = document.getElementById("cartCount");
const spinSound = document.getElementById("spinSound");
const addCartSound = document.getElementById("addCartSound");
const tickSound = document.getElementById("tickSound");

// ================== TOAST NOTIFICATIONS ==================
function showToast(msg){
  const toast = document.createElement("div");
  toast.className = "toast show";
  toast.innerText = msg;
  document.body.appendChild(toast);
  setTimeout(()=>{
    toast.classList.remove("show");
    toast.classList.add("hide");
    setTimeout(()=>toast.remove(),500);
  },2000);
}

// ================== CART FUNCTIONS ==================
function loadCart(){
  const stored = localStorage.getItem("cherryCart");
  if(stored) cart = JSON.parse(stored);
  const savedDiscount = localStorage.getItem("cherryDiscount");
  if(savedDiscount) discount = parseInt(savedDiscount);
}
function saveCart(){
  localStorage.setItem("cherryCart", JSON.stringify(cart));
  localStorage.setItem("cherryDiscount", discount);
}
loadCart();

function addToCart(product, qty=1){
  let existing = cart.find(i=>i.name===product.name);
  if(existing) existing.qty += qty;
  else cart.push({...product, qty});
  updateCart();
  saveCart();
  addCartSound.currentTime = 0;
  addCartSound.play();
  showToast(`${product.name} x${qty} added to cart!`);
}

function updateCart(){
  cartItems.innerHTML = "";
  let total = 0;
  cart.forEach((item,i)=>{
    total += item.price * item.qty;
    cartItems.innerHTML += `<div style="display:flex;justify-content:space-between;margin:5px 0;">
      <span>${item.name} x${item.qty}</span>
      <div>
        <button onclick="changeQty(${i},-1)">-</button>
        <button onclick="changeQty(${i},1)">+</button>
      </div>
    </div>`;
  });
  total = total * (1 - discount/100);
  cartTotal.textContent = total.toFixed(2);
  cartCount.textContent = cart.reduce((a,b)=>a+b.qty,0);
  document.getElementById("paypalCheckout").href = `https://www.paypal.com/paypalme/YOURNAME/${total.toFixed(2)}`;
}

function changeQty(i, amt){
  cart[i].qty += amt;
  if(cart[i].qty <= 0) cart.splice(i,1);
  updateCart();
  saveCart();
}

// ================== RENDER PRODUCTS ==================
function renderCategory(category){
  grid.innerHTML = "";
  storeData[category].forEach(product=>{
    let price = product.price * (1 - discount/100);
    const card = document.createElement("div");
    card.classList.add("card");
    card.innerHTML = `${product.popular?'<span class="popular-badge">⭐ MOST POPULAR</span>':''}
      <h3 title="${product.desc||'Premium server item'}">${product.name}</h3>
      <p>${product.desc||'Premium server item'}</p>
      ${discount>0?`<div style="text-decoration:line-through;opacity:0.6;">€${product.price.toFixed(2)}</div>`:""}
      <div class="price">€${price.toFixed(2)}</div>
      <button class="buy">Add to Cart</button>`;
    const buyBtn = card.querySelector(".buy");
    buyBtn.onclick = ()=> addToCart(product,1);
    grid.appendChild(card);
  });
}
document.querySelectorAll(".category-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".category-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    renderCategory(btn.dataset.category);
  }
});
renderCategory("crates");

// ================== CART MODAL ==================
cartBtn.onclick = ()=> cartModal.classList.add("active");
closeCart.onclick = ()=> cartModal.classList.remove("active");

// ================== DISCOUNT CODES ==================
document.getElementById("applyDiscount").onclick = ()=>{
  const code = document.getElementById("discountCode").value.toUpperCase();
  if(discountCodes[code]){
    discount = discountCodes[code];
    saveCart();
    updateCart();
    showToast(`Discount ${discount}% applied!`);
  } else showToast("Invalid Code!");
};

// ================== MOBILE MENU ==================
document.getElementById("mobileMenuBtn").onclick = ()=>{
  document.querySelector("nav ul").classList.toggle("show");
};

// ================== STATS ANIMATION ==================
document.querySelectorAll(".stat").forEach(el=>{
  let target = parseFloat(el.dataset.target);
  let current = 0;
  const inc = target/100;
  const interval = setInterval(()=>{
    current += inc;
    if(current >= target){ current = target; clearInterval(interval); }
    el.textContent = target%1===0?Math.floor(current):current.toFixed(1);
  },20);
});

// ================== SPINNING WHEEL ==================
const wheelCanvas = document.getElementById("wheelCanvas");
const ctx = wheelCanvas.getContext("2d");
const segments = ["10 Credits","50 Credits","100 Credits","VIP 1d","VIP 7d","Cherry Key","Maple Key"];
const colors = ["#ff2d6f","#ff7eb3","#ff9ec9","#ff2d6f","#ff7eb3","#ff9ec9","#ff2d6f"];
let spinAllowed = true;

function drawWheel(angle=0){
  const size = 300;
  const segAngle = 2*Math.PI / segments.length;
  ctx.clearRect(0,0,size,size);
  ctx.save();
  ctx.translate(size/2,size/2);
  ctx.rotate(angle);
  segments.forEach((s,i)=>{
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.fillStyle = colors[i % colors.length];
    ctx.arc(0,0,size/2,i*segAngle,(i+1)*segAngle);
    ctx.fill();
    ctx.save();
    ctx.rotate(i*segAngle + segAngle/2);
    ctx.fillStyle="#fff";
    ctx.font="bold 14px Inter";
    ctx.textAlign="right";
    ctx.fillText(s,size/2-10,5);
    ctx.restore();
  });
  ctx.restore();
}
drawWheel();

document.getElementById("spinWheel").onclick = ()=>{
  if(!spinAllowed){ showToast("Already spun today!"); return; }
  spinAllowed = false;
  spinSound.currentTime = 0; spinSound.play();
  let spins = Math.random()*10 + 10;
  let angle = 0;
  const totalFrames = 60*5;
  let frame = 0;
  const spinInterval = setInterval(()=>{
    angle += (spins*(2*Math.PI))/totalFrames;
    drawWheel(angle);
    if(frame % 5 === 0) tickSound.play();
    frame++;
    if(frame >= totalFrames){
      clearInterval(spinInterval);
      const landed = Math.floor((angle%(2*Math.PI))/(2*Math.PI/segments.length));
      document.getElementById("spinResult").textContent = `You won: ${segments[segments.length-1-landed]}!`;
      confetti({particleCount:100});
    }
  },16);
};
</script>

</body>
</html>
