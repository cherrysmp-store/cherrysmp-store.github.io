<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherrySMP Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1f2a1f, #2c3e50);
    color: #e8f5e9;
    min-height: 100vh;
    overflow-y: auto;
}

/* Header */
header {
    text-align: center;
    padding: 30px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #3a5a40;
}

h1 {
    color: #7cf07c;
    text-shadow: 0 0 10px rgba(124,240,124,0.4);
}

/* Sale banner */
.sale-banner {
    text-align: center;
    padding: 10px;
    background: linear-gradient(90deg, #4caf50, #81c784);
    font-weight: bold;
    color: white;
}

/* Layout */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    padding: 40px;
}

/* Cards */
.card {
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    padding: 20px;
    border: 1px solid rgba(124,240,124,0.2);
    transition: 0.3s;
    cursor: pointer;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    border-color: #7cf07c;
}

/* Product cards */
.product-card {
    background: rgba(255,255,255,0.07);
    border-radius: 15px;
    padding: 15px;
    border: 1px solid rgba(124,240,124,0.2);
    transition: 0.3s;
}

.product-card:hover {
    transform: scale(1.03);
}

/* Highlight spring item */
.spring-glow {
    border: 2px solid #7cf07c;
    box-shadow: 0 0 15px rgba(124,240,124,0.4);
}

/* Prices */
.price-old {
    text-decoration: line-through;
    opacity: 0.6;
    font-size: 0.9em;
}

.price-new {
    color: #7cf07c;
    font-weight: bold;
    font-size: 1.2em;
}

/* Buttons */
button {
    background: #7cf07c;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
    font-weight: bold;
}

button:hover {
    background: #5edc5e;
}

/* Cart */
#cart {
    position: fixed;
    right: 20px;
    top: 20px;
    width: 280px;
    background: rgba(0,0,0,0.6);
    padding: 15px;
    border-radius: 15px;
    border: 1px solid #3a5a40;
}

#products {
    padding: 40px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<header>
    <h1>🌸 CherrySMP Store 🌸</h1>
</header>

<div class="sale-banner">
    🌷 Spring Sale - 20% OFF EVERYTHING 🌷
</div>

<div class="container">
    <div class="card" onclick="openCategory('ranks')"><h2>Ranks</h2></div>
    <div class="card" onclick="openCategory('crates')"><h2>Crates</h2></div>
    <div class="card" onclick="openCategory('bundles')"><h2>Bundles</h2></div>
    <div class="card" onclick="openCategory('stuff')"><h2>Stuff</h2></div>
</div>

<div id="products" class="container hidden"></div>

<div id="cart">
    <h3>🛒 Cart</h3>
    <div id="cart-items"></div>
    <p id="total"></p>
    <button onclick="checkoutPayPal()">PayPal</button>
    <button onclick="checkoutBank()">Bank Transfer</button>
</div>

<script src="script.js"></script>
</body>
</html>
