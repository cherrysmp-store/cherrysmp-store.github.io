<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherrySMP Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1f2a1f, #2c3e50);
    color: #e8f5e9;
}

/* Navbar */
.navbar {
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
    align-items: center;
    z-index: 1000;
    border-bottom: 1px solid #3a5a40;
}

.nav-links button {
    background: none;
    border: none;
    color: white;
    margin: 0 10px;
    font-size: 16px;
    cursor: pointer;
}

.nav-links button:hover {
    color: #7cf07c;
}

/* Sections */
.section {
    display: none;
    padding: 40px;
    animation: fadeIn 0.5s ease;
}

.section.active {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

/* Cards */
.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(124,240,124,0.2);
}

.card:hover {
    transform: translateY(-5px);
}

/* Prices */
.price-old {
    text-decoration: line-through;
    opacity: 0.6;
}

.price-new {
    color: #7cf07c;
    font-weight: bold;
}

/* Subscription highlight */
.subscription {
    margin: 40px;
    padding: 25px;
    text-align: center;
    border-radius: 15px;
    border: 2px solid #7cf07c;
    box-shadow: 0 0 20px rgba(124,240,124,0.3);
}

/* Cart */
#cart {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 260px;
    background: rgba(0,0,0,0.7);
    padding: 15px;
    border-radius: 12px;
}

button {
    background: #7cf07c;
    border: none;
    padding: 6px 10px;
    margin-top: 8px;
    cursor: pointer;
    border-radius: 6px;
}

/* Coupon */
.coupon-box {
    margin-top: 10px;
}

input {
    padding: 6px;
    border-radius: 5px;
    border: none;
    margin-right: 5px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px);}
    to { opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="navbar">
    <div><strong>🌸 CherrySMP</strong></div>

    <div class="nav-links">
        <button onclick="showSection('ranks')">Ranks</button>
        <button onclick="showSection('crates')">Crates</button>
        <button onclick="showSection('bundles')">Bundles</button>
        <button onclick="showSection('stuff')">Stuff</button>
        <a href="https://discord.gg/YOUR_INVITE" target="_blank" style="color:#7cf07c; margin-left:15px;">Discord</a>
    </div>
</div>

<div id="ranks" class="section active"></div>
<div id="crates" class="section"></div>
<div id="bundles" class="section"></div>
<div id="stuff" class="section"></div>

<div class="subscription">
    <h2>⭐ Cherry Subscription</h2>
    <p>Monthly perks + weekly crates + Discord benefits</p>
    <p><strong>€10 / month</strong></p>
    <button onclick="addToCart('Subscription', 10)">Subscribe</button>
</div>

<div id="cart">
    <h3>Cart</h3>
    <div id="cart-items"></div>

    <div class="coupon-box">
        <input id="coupon" placeholder="Coupon code">
        <button onclick="applyCoupon()">Apply</button>
    </div>

    <p id="total"></p>

    <button onclick="checkoutPayPal()">Pay with PayPal</button>
    <button onclick="checkoutBank()">Bank Transfer</button>
</div>

<script src="script.js"></script>
</body>
</html>
