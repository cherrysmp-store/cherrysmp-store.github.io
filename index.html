<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherrySMP Store</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1020;
  --card:#121a33;
  --accent:#ff4d8d;
  --accent2:#ff9ec0;
}

body{
  margin:0;
  background:linear-gradient(180deg,#0b1020,#050814);
  color:white;
  font-family:'Inter',sans-serif;
}

h1,h2,h3{font-family:'Press Start 2P',cursive;}

header{
  text-align:center;
  padding:60px 20px;
}

header h1{
  color:var(--accent);
  font-size:42px;
}

.sale-banner{
  background:linear-gradient(90deg,#ff4d8d,#ff9ec0);
  padding:12px;
  border-radius:12px;
  margin-top:20px;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  transition:0.3s;
  position:relative;
  border:1px solid rgba(255,255,255,0.05);
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(255,77,141,0.3);
}

.price{
  margin:10px 0;
}

.old-price{
  text-decoration:line-through;
  opacity:0.6;
  font-size:12px;
}

button{
  background:var(--accent);
  border:none;
  padding:10px 15px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

#cart{
  margin-top:40px;
}

.code-box{
  background:#000;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
  font-family:monospace;
}
</style>
</head>

<body>

<header>
<h1>CherrySMP 🍒</h1>

<div class="sale-banner">
🌸 SPRING SALE - 20% OFF EVERYTHING 🌸<br>
Ends April 4
</div>

</header>

<div class="container">
<h2>Ranks</h2>
<div class="grid">

<div class="card">
<h3>VIP</h3>
<div class="old-price">€1.99</div>
<div class="price">€1.59</div>
<button onclick="addToCart('VIP',1.59)">Add</button>
</div>

<div class="card">
<h3>Cherry+</h3>
<div class="old-price">€7.99</div>
<div class="price">€6.39</div>
<button onclick="addToCart('Cherry+',6.39)">Add</button>
</div>

<div class="card">
<h3>🌸 Spring Rank (LIMITED)</h3>
<div class="old-price">€9.99</div>
<div class="price">€7.99</div>
<p>Same perks as Cherry+ + Exclusive Kit</p>
<button onclick="addToCart('Spring Rank',7.99)">Add</button>
</div>

</div>

<h2>Crates</h2>
<div class="grid">
<div class="card">
<h3>Cherry Crate</h3>
<div class="old-price">€2.19</div>
<div class="price">€1.75</div>
<button onclick="addToCart('Cherry Crate',1.75)">Add</button>
</div>
</div>

<div id="cart">
<h2>Cart</h2>
<ul id="cartItems"></ul>
<p>Total: €<span id="total">0</span></p>
<button onclick="checkout()">Checkout</button>

<div id="generatedCode" class="code-box" style="display:none"></div>
</div>

</div>

<script>
let cart=[];

function addToCart(name,price){
  cart.push({name,price});
  updateCart();
}

function updateCart(){
  let list=document.getElementById('cartItems');
  let total=0;
  list.innerHTML='';

  cart.forEach(i=>{
    total+=i.price;
    let li=document.createElement('li');
    li.textContent=i.name + ' €'+i.price;
    list.appendChild(li);
  });

  document.getElementById('total').textContent=total.toFixed(2);
}

function generateCode(){
  let items=cart.map(i=>i.name.replace(/ /g,'')).join('-');
  let random=Math.random().toString(36).substring(2,8).toUpperCase();
  return "CHERRY-"+items+"-"+random;
}

function checkout(){
  if(cart.length===0){alert('Empty');return;}

  let code=generateCode();

  document.getElementById('generatedCode').style.display='block';
  document.getElementById('generatedCode').innerText=
    "Your Order Code:\n"+code+"\n\nSend this code in Discord ticket.";

  // OPTIONAL: open discord
  window.open("https://discord.gg/FWauk2sxQs");
}
</script>

</body>
</html>
